<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Грейды медсестёр</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Sans+Narrow:wght@700&display=swap">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14223d;--muted:#5b6782;--line:#d2d8e4;--navy:#1b2f57;--navy-soft:#e5eaf4;--terra:#b8562f;--terra-soft:#f7e4da;--ok:#2d7a4b;--ok-soft:#e0f0e6;--bad:#b23a2c;--bad-soft:#f8e0dc;--g0:#6f7a91;--g1:#2b7273;--g2:#b8562f;
--f-body:"PT Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-head:"PT Sans Narrow","PT Sans",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff}
.in{max-width:980px;margin:0 auto;padding:0 16px}
.top .in{padding-top:10px;display:flex;flex-direction:column;gap:8px}
.row1{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
h1{font-family:var(--f-head);font-size:22px;margin:0;flex:1 1 auto}
h1 a{display:block;color:inherit;opacity:.7;text-decoration:none;font:700 14px var(--f-body)}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:#fff;border-radius:6px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:14px}
.seg button.on{background:#fff;color:var(--navy)}
.srch{position:relative}
.srch input{width:100%;border:0;border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);color:var(--ink);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto;z-index:9}
.sug div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.sug div:hover{background:var(--navy-soft)}
.sug small{color:var(--muted);display:block}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{background:none;border:0;color:#c9d4ea;padding:9px 12px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--terra)}
main .in{padding-top:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-family:var(--f-head);font-size:19px;margin:0 0 8px;color:var(--navy)}
h3{font-size:14px;margin:12px 0 6px;color:var(--navy)}
.mut{color:var(--muted);font-size:13px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.t{background:var(--terra)}.btn.g{background:var(--card);color:var(--navy);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:13px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.auto{background:var(--ok-soft);color:var(--ok);border-color:transparent;cursor:default}
.chip.auto:before{content:"✓ "}
.badge{display:inline-block;min-width:46px;text-align:center;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:#b9c0cc}
.b0{background:var(--g0)}.b1{background:var(--g1)}.b2{background:var(--g2)}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:16px;display:flex;gap:16px;align-items:center;margin-bottom:12px}
.ring{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:21px}.ring span{font-size:11px;opacity:.75}
.ht{font:700 19px var(--f-head);margin:2px 0}.hs{font-size:13px;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:10px}.kpi b{display:block;font-size:20px;color:var(--navy)}.kpi span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--navy-soft);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--terra)}
.miss{background:var(--terra-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0 0}.miss ul{margin:4px 0 0;padding-left:18px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.gm{display:grid;grid-template-columns:110px repeat(3,1fr);gap:4px;margin-top:10px}
.gl{font-size:12px;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.gc{border-radius:9px;min-height:62px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.gc.g0{background:#eceef3}.gc.g1{background:#dcefee}.gc.g2{background:var(--terra-soft)}
.gc.here{outline:3px solid var(--terra)}
.gx{font-size:10px;font-weight:700;text-transform:uppercase;text-align:center;padding:4px 0;color:#fff;border-radius:6px}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--terra);color:#fff}
.tag.ok{background:var(--ok)}.tag.res{background:#fff;color:var(--g1);border:1px solid var(--g1)}.tag.need{background:#fff;color:var(--muted);border:1px dashed var(--muted)}
.sd{display:flex;gap:3px}.sd i{font-style:normal;font-size:9px;font-weight:700;width:28px;height:20px;border-radius:5px;background:#fff;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sd i.d{background:var(--ok);color:#fff}.sd i.c{background:var(--terra);color:#fff}
.axx{text-align:right;font-size:11px;font-weight:700;color:var(--terra);margin-top:4px}.axy{font-size:11px;font-weight:700;color:var(--navy)}
.climb{position:relative}
.climb:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--line)}
.lv{position:relative;display:flex;align-items:center;gap:10px;width:calc(50% + 24px);margin:8px 0}
.lv.l{flex-direction:row-reverse;text-align:right}.lv.r{margin-left:calc(50% - 24px)}
.lc{width:48px;height:48px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;border:4px solid var(--card);z-index:1}
.lc.g0{background:var(--g0)}.lc.g1{background:var(--g1)}.lc.g2{background:var(--g2)}
.lt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;flex:1;min-width:0}
.ln{font-weight:700;font-size:14px}.lo{font-size:12px;color:var(--muted)}.ls{font-size:11px;font-weight:700;margin-top:3px;color:var(--muted)}
.lv.lock{opacity:.5}.lv.done .ls{color:var(--ok)}.lv.cur .lt{border:2px solid var(--terra)}.lv.cur .ls,.lv.next .ls{color:var(--terra)}.lv.next .lt{border:2px dashed var(--terra)}
.band{position:relative;z-index:1;width:max-content;margin:4px auto;padding:3px 14px;border-radius:999px;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase}
.lsal{font-weight:700;color:var(--navy);font-size:13px;margin-top:3px}
.band.g0{background:var(--g0)}.band.g1{background:var(--g1)}.band.g2{background:var(--g2)}
.sticky{position:sticky;top:118px;z-index:4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px}
.opt .row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.opt .row:last-child{border-bottom:0}
.opt .row.pick{background:var(--terra-soft);margin:0 -10px;padding:7px 10px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.crit{font-size:10px;background:var(--bad-soft);color:var(--bad);padding:2px 6px;border-radius:99px;font-weight:700}
.when{font-weight:700;color:var(--navy)}
select,input[type=number],input[type=text],textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card)}
textarea{width:100%}
.stp{display:flex;align-items:center;gap:6px}.stp button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.hscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.grid{min-width:1100px;font-size:12px}table.grid td,table.grid th{border:1px solid var(--line)}
table.grid th{color:#fff}.g0h{background:var(--g0)}.g1h{background:var(--g1)}.g2h{background:var(--g2)}
td.cat{font-weight:700;background:var(--bg);white-space:nowrap}
.lvsel{display:flex;gap:3px}.lvsel button{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.lvsel button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.lvsel button.need{border:2px solid var(--terra)}
.pr2{padding:8px 0;border-bottom:1px solid var(--line)}.pr2:last-child{border-bottom:0}.prh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.slot{display:grid;grid-template-columns:22px minmax(0,220px) 96px;gap:8px;align-items:center;margin:4px 0}.sn{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.slot input[type=datetime-local]{border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:var(--card);width:100%}.slot .btn:disabled{opacity:.45}
.addv{border:1px dashed var(--line);background:none;border-radius:9px;padding:5px 10px;font-size:12px;color:var(--navy);cursor:pointer;margin:4px 0 0 30px}
.pr{display:grid;grid-template-columns:1fr 210px 96px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.pr:last-child{border-bottom:0}.prn{font-size:14px}
.pr input[type=datetime-local]{border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:var(--card);min-width:0;width:100%}
.pr .btn:disabled{opacity:.45;cursor:default}
@media(max-width:620px){.pr{grid-template-columns:1fr 96px}.pr .prn{grid-column:1/3}}
.bl{display:grid;grid-template-columns:1fr 200px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bl.dn{opacity:.7}.blw{display:flex;flex-direction:column;gap:4px;min-width:0}.blw .chip{padding:3px 9px;font-size:12px}.plist{margin-top:2px}.pg{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:6px 0 3px}
.bl input[type=datetime-local]{border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:var(--card);min-width:0}
.chk{background:var(--terra-soft);border-radius:12px;padding:8px 12px;margin:6px 0 10px}
@media(max-width:620px){.bl{grid-template-columns:1fr auto}.bl input[type=datetime-local]{grid-column:1/2}}
.pf{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;padding:4px 0}.pfn{font-size:13px}.mand{font-size:9px;color:var(--terra);text-transform:uppercase}
.pfb{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}.pfb i{height:12px;border-radius:3px;background:var(--navy-soft);position:relative}.pfb i.f{background:var(--g1)}.pfb i.ov{background:var(--ok);opacity:.55}.pfb i.gl{outline:2px solid var(--terra);outline-offset:1px}
.pfv{font-size:12px;font-weight:700;text-align:right}.pfv.low{color:var(--bad)}.pfv.over{color:var(--ok)}
.pfk{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}.pfk i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}.pfk i.f{background:var(--g1)}.pfk i.ov{background:var(--ok);opacity:.55}.pfk i.gl0{outline:2px solid var(--terra);background:var(--navy-soft)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}.mode span{font-size:12px;color:var(--muted)}.mode.on{border:2px solid var(--terra);background:var(--terra-soft)}
@media(max-width:620px){.modes{grid-template-columns:1fr}.pf{grid-template-columns:110px 1fr 40px}}
.adv{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:9px 10px;border-radius:10px;margin:6px 0;font-size:14px}
.adv .ai{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.adv.bad{background:var(--bad-soft)}.adv.bad .ai{background:var(--bad)}.adv.warn{background:#fbefd1}.adv.warn .ai{background:#a56c00}.adv.ok{background:var(--ok-soft)}.adv.ok .ai{background:var(--ok)}.adv.info{background:var(--navy-soft)}.adv.info .ai{background:var(--navy)}
.hint{margin:0 0 8px;font-size:12.5px;color:var(--muted);border-left:3px solid var(--terra);padding-left:8px}
.norms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.norms label{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:4px}.norms span{font-weight:400;color:var(--muted)}.norms input{width:64px}
.salhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:10px}.salhead b{display:block;font:700 26px var(--f-head);color:var(--navy)}.salnext{text-align:right}.salnext b{font-size:20px;color:var(--g1)}.salnext em{display:block;font-style:normal;font-weight:700;font-size:13px}.salnext em.up{color:var(--ok)}.salnext em.dn{color:var(--bad)}
.bands{display:flex;flex-direction:column;gap:14px;margin-top:6px}.bandrow{display:grid;grid-template-columns:78px 1fr 92px;gap:8px;align-items:center}.bl0{font-size:12px;font-weight:700}.br0{font-size:11px;color:var(--muted);text-align:right}
.track{position:relative;height:16px;background:var(--bg);border-radius:99px}.rng{position:absolute;top:0;bottom:0;border-radius:99px;opacity:.35}.rng.g0{background:var(--g0)}.rng.g1{background:var(--g1)}.rng.g2{background:var(--g2)}
.tick{position:absolute;top:-3px;width:10px;height:22px;margin-left:-5px;border-radius:5px;background:#fff;border:2px solid var(--muted)}.tick span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:9px;font-style:normal;color:var(--muted);white-space:nowrap}
.tick.past{border-color:var(--ok);background:var(--ok)}.tick.me{border-color:var(--terra);background:var(--terra);transform:scale(1.25)}.tick.me span{color:var(--terra);font-weight:700}
.tl{position:relative;margin-left:4px}
.tlg{display:flex;justify-content:space-between;color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;padding:6px 12px;border-radius:10px;margin:12px 0 6px}.tlg.g0{background:var(--g0)}.tlg.g1{background:var(--g1)}.tlg.g2{background:var(--g2)}.tlg span:last-child{text-transform:none;font-weight:400}
.tli{position:relative;display:grid;grid-template-columns:44px 1fr;gap:10px;padding:0 0 10px}.tli:before{content:"";position:absolute;left:20px;top:40px;bottom:-2px;width:3px;background:var(--line)}.tli.done:before{background:var(--ok)}
.tln{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;z-index:1;border:3px solid var(--card)}.tln.g0{background:var(--g0)}.tln.g1{background:var(--g1)}.tln.g2{background:var(--g2)}
.tli.done .tln{background:var(--ok)}.tli.lock .tln{filter:grayscale(.6);opacity:.55}.tli.cur .tln{box-shadow:0 0 0 4px var(--terra-soft);background:var(--terra)}
.tlc{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}.tli.cur .tlc{border:2px solid var(--terra);background:var(--terra-soft)}.tli.next .tlc{border:2px dashed var(--terra)}.tli.lock .tlc{opacity:.75}
.tlt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.tls{font-weight:700;color:var(--navy);white-space:nowrap}.tlf{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px}.tlb{font-weight:700}.tli.done .tlb{color:var(--ok)}.tli.cur .tlb,.tli.next .tlb{color:var(--terra)}
.saltab input{width:70px}
.navbar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--navy-soft);border-radius:12px;padding:10px 12px}.navbar b{display:block;font-size:15px;color:var(--navy)}.navbar .arrow{font-size:22px;color:var(--terra);font-weight:700}
.tree{position:relative}
.tg{display:inline-block;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:3px 12px;border-radius:99px;margin:10px 0 4px 0}.tg.g0{background:var(--g0)}.tg.g1{background:var(--g1)}.tg.g2{background:var(--g2)}
.tr{display:grid;grid-template-columns:46px 1fr;align-items:center;min-height:52px}
.rail{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}
.rail:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--line)}
.tr.done .rail:before{background:var(--ok)}.tr.cur .rail:before{background:linear-gradient(var(--ok) 50%,var(--terra) 50%)}.tr.route .rail:before{background:repeating-linear-gradient(var(--terra) 0 6px,transparent 6px 11px)}
.dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;border:3px solid var(--card)}
.dot.g0{background:var(--g0)}.dot.g1{background:var(--g1)}.dot.g2{background:var(--g2)}.tr.done .dot{background:var(--ok)}.tr.lock .dot{opacity:.45}.tr.cur .dot{background:var(--terra);width:44px;height:44px;box-shadow:0 0 0 5px var(--terra-soft)}
.node{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:4px 0;background:var(--card);cursor:help;outline:none}
.node span{font-size:12px;font-weight:700;color:var(--muted)}.tr.cur .node{border:2px solid var(--terra);background:var(--terra-soft)}.tr.cur .node span{color:var(--terra)}.tr.route .node{border:2px dashed var(--terra)}.tr.route .node span{color:var(--terra)}.tr.lock:not(.route) .node{opacity:.6}.tr.done .node span{color:var(--ok)}
.branch{margin:0 0 4px 22px;padding:6px 0 8px 30px;border-left:3px dotted var(--line);position:relative}.branch:before{content:"";position:absolute;left:-3px;top:14px;width:24px;border-top:3px dotted var(--line)}
.bh{font-size:12px;font-weight:700;color:var(--g1);margin-bottom:6px}.branch.mg .bh{color:var(--g2)}
.leaves{display:flex;flex-wrap:wrap;gap:6px}.leaf{font-size:12.5px;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);cursor:help;outline:none;display:inline-flex;gap:6px;align-items:center}
.leaf em{font-style:normal;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:#fff;color:var(--muted)}.leaf.ok em{background:var(--ok);color:#fff}.leaf.res em{background:var(--g1);color:#fff}

function catLevel(n,c){let l=-1;for(let i=0;i<9;i++){const r=STEPS[i].req.filter(x=>catOf(x.t)===c);if(r.every(x=>x.f(n)))l=i;else break}return l}

function mandLevel(n){let l=-1;for(let i=0;i<9;i++){if(STEPS[i].req.filter(r=>MAND(r.t)).every(r=>r.f(n)))l=i;else break}return l}
function gradeHybrid(n){const lv={};CATS.forEach(([c])=>lv[c]=catLevel(n,c));let l=-1;n._comp=[];
 for(let i=0;i<9;i++){const miss=STEPS[i].req.filter(r=>!r.f(n));if(miss.some(r=>MAND(r.t)))break;if(miss.length>1)break;
  if(miss.length===1){const over=Object.entries(lv).find(([c,v])=>c!==catOf(miss[0].t)&&v>i&&CW[c]);if(!over)break;n._comp.push({step:STEPS[i].id,miss:miss[0].t,by:over[0]})}l=i}return l}

 h+='</div></div>';
 const rows=[{id:'nurse',name:'Медсестра',min:0},...POS];

  return `<div class="gl">${r.name}${r.id!=='nurse'?`<span class="mut" style="font-weight:400;font-size:10px">с ${STEPS[r.min].id}${r.extra?' + '+r.extra:''}</span>`:''}</div>${[0,1,2].map(g=>{let inner='';const here=r.id==='nurse'&&g===cg;
   if(r.id==='nurse')inner=`<div class="sd">${[0,1,2].map(k=>{const i=g*3+k;return `<i class="${i<=l?(i===l?'c':'d'):''}">${STEPS[i].id}</i>`}).join('')}</div>${here?'<span class="tag">Вы здесь</span>':''}`;
   else if(g===cg)inner=st==='ok'?'<span class="tag ok">Готова</span>':st==='res'?'<span class="tag res">Кадровый резерв</span>':'<span class="tag need">Можно расти</span>';

   return `<div class="gc g${g} ${here?'here':''}">${inner}</div>`}).join('')}`}).join('')}<div></div>${GRN.map((x,i)=>`<div class="gx b${i}">${x}<br><span style="font-weight:400;text-transform:none">${kk(gradeRange(i)[0])}–${kk(gradeRange(i)[1])}</span></div>`).join('')}</div><div class="axx">Профессиональный рост →</div>
  ${e.dir==='prof'&&e.spec?`<div class="okbox">Специализация: ${SPECS[e.spec][0]} · ${SLVL[+e.specLvl]}</div>`:''}${e.dir==='mgmt'&&e.reserve?`<div class="okbox">В кадровом резерве: ${POS.find(x=>x.id===e.reserve).name}</div>`:''}</div>`;

 <div class="pfk"><span><i class="f"></i>в пределах ступени</span><span><i class="ov"></i>перевыполнение</span><span><i class="gl0"></i>текущая ступень</span></div>
 ${(S.rules||{}).mode==='hybrid'&&(n._comp||[]).length?`<div class="okbox">Засчитано с компенсацией: ${n._comp.map(x=>`${x.step} — «${esc(x.miss)}» перекрыто опережением по критерию «${x.by}»`).join('; ')}</div>`:''}</div>`}

function etaMonths(from,to){let m=0;for(let i=Math.max(from,0);i<to;i++)m+=NORM().g[STEPS[i+1]?STEPS[i].g:2];return m}
function navTree(p,n,l,e){const tip=(t)=>`tabindex="0" data-tip="${esc(t)}"`;
 const tgtSpec=e.dir==='prof'&&e.spec?e.spec:null,tgtPos=e.dir==='mgmt'&&e.reserve?e.reserve:null;
 const tgtStep=tgtPos?POS.find(x=>x.id===tgtPos).min:tgtSpec?3:Math.min(l+1,8);
 const route=[];if(l<8)for(let i=Math.max(l+1,0);i<=Math.max(tgtStep,l+1)&&i<9;i++)route.push(STEPS[i].id);
 const tgtName=tgtPos?POS.find(x=>x.id===tgtPos).name:tgtSpec?SPECS[tgtSpec][0]:l<8?STEPS[Math.min(l+1,8)].id+' · '+STEPS[Math.min(l+1,8)].name:'Вершина';
 const eta=etaMonths(l,Math.max(tgtStep,l+1));
 let h=`<div class="card"><h2>Навигатор карьеры</h2>
 <div class="navbar"><div><span class="mut">Вы здесь</span><b>${l>=0?STEPS[l].id+' · '+STEPS[l].name:'Старт'}</b></div><div class="arrow">→</div><div><span class="mut">Цель</span><b>${esc(tgtName)}</b></div></div>
 ${l<8?`<div class="mut" style="margin:6px 0 2px">Маршрут: ${route.join(' → ')}${tgtPos?' → '+esc(tgtName):tgtSpec&&l<3?' → '+esc(tgtName):''} · ориентировочно до ${eta} мес по нормативу</div>`:''}
 <p class="mut" style="margin:4px 0 10px">Наведите или нажмите на ступень, чтобы увидеть оклад и что нужно.</p><div class="tree">`;
 const branchAt={3:'spec',5:'mgmt',6:'head'};
 for(let i=0;i<9;i++){const s=STEPS[i],st=i<l?'done':i===l?'cur':i===l+1?'next':'lock',m=s.req.filter(r=>!r.f(n)).length,onRoute=route.includes(s.id);
  if(i===0||STEPS[i-1].g!==s.g)h+=`<div class="tg g${s.g}">${GRN[s.g]}</div>`;
  h+=`<div class="tr ${st} ${onRoute?'route':''}"><div class="rail"><span class="dot g${s.g}">${st==='done'?'✓':s.id}</span></div>
   <div class="node tip" ${tip(s.id+' · '+s.name+'\nОклад: '+money(salOf(i))+(st==='done'||st==='cur'?'':'\nОсталось требований: '+m+' из '+s.req.length))}><b>${s.name}</b><span>${st==='cur'?'📍 Вы здесь':st==='done'?'пройдено':st==='next'?'следующая цель':onRoute?'на маршруте':''}</span></div></div>`;
  const br=branchAt[i];
  if(br==='spec')h+=`<div class="branch"><div class="bh">↳ Профессиональный рост: специализация</div><div class="leaves">${Object.entries(SPECS).map(([k,[nm]])=>`<span class="leaf tip ${tgtSpec===k?'tgt':''} ${l>=3?'open':''}" ${tip(nm+'\nОткрывается с '+s.id+'\nУровни: базовый, продвинутый, эксперт'+(tgtSpec===k?'\nВыбрана как цель':''))}>${nm}${tgtSpec===k?' · '+SLVL[+e.specLvl]:''}</span>`).join('')}</div></div>`;
  if(br==='mgmt'||br==='head'){const list=POS.filter(x=>x.min===i);h+=`<div class="branch mg"><div class="bh">↳ Управленческий рост</div><div class="leaves">${list.map(x=>{const ps=posState(n,l,x),need=posNeed(n,l,x);return `<span class="leaf tip ${tgtPos===x.id?'tgt':''} ${ps}" ${tip(x.name+'\nНазначение с '+STEPS[x.min].id+(x.extra?' + '+x.extra:'')+'\n'+(ps==='ok'?'Условия выполнены':ps==='res'?'Можно в кадровый резерв':'')+(need.length&&ps!=='ok'?'\nНужно: '+need.join('; '):''))}>${x.name}<em>${ps==='ok'?'готова':ps==='res'?'резерв':'с '+STEPS[x.min].id}</em></span>`}).join('')}</div></div>`}
 }
 return h+`</div><div class="legend"><span><i class="d1"></i>пройдено</span><span><i class="d2"></i>вы здесь</span><span><i class="d3"></i>ваш маршрут</span><span><i class="d4"></i>впереди</span></div></div>`}
const nextY=d=>{const x=new Date(d);x.setFullYear(x.getFullYear()+1);return x.toISOString().slice(0,10)};

 h+=`<div class="card"><h2>Текущая должность</h2><p class="hint">Если медсестру назначили на управленческую должность, отметьте её и дату — начнётся отсчёт адаптации (${NORM().adapt} мес).</p><div class="chips">${[['nurse','Медсестра'],...POS.map(x=>[x.id,x.name])].map(([k,v])=>`<button class="chip ${(e.pos||'nurse')===k?'on':''}" data-pos="${k}">${v}</button>`).join('')}</div>${e.pos&&e.pos!=='nurse'?`<div class="flex" style="margin-top:8px"><span class="mut">Дата назначения</span><input type="date" id="posSince" value="${e.posSince||''}"></div>`:''}</div>`;

 <p class="mut">Аудит подтягивается автоматически из вкладки «Аудит», компетенции — из вкладки «Компетенции».</p></div>`;

function vComp(p){const n=N(p),e=E(p),l=grade(n),nx=Math.min(l+1,8),pct=compPct(n,nx);
