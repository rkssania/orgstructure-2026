<script src="config.js?v=2"></script>
<script>
/* Адаптер к общей базе «Функционала» (Supabase, таблица items): коллекции sb_cfg, sb_mon, sb_reviews */
(function(){
  const PFX='sb_';
  let SB=null, ME=null, ready=null;
  function init(){
    if(ready)return ready;
    ready=(async()=>{
      if(!window.supabase||!window.SUPABASE_URL)return false;
      SB=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
      const {data:{session}}=await SB.auth.getSession();
      if(!session)return false;
      ME=session.user.email;
      try{const {data:ok,error}=await SB.rpc('is_allowed');if(!error&&ok===false)return false}catch(_){}
      return true;
    })();
    return ready;
  }
  const split=p=>{const i=p.indexOf('/');return [PFX+p.slice(0,i),p.slice(i+1)]};
  const mk=(id,data)=>({id,data:()=>data});
  const db={
    doc(path){const [coll,id]=split(path);return {
      async get(){const {data,error}=await SB.from('items').select('data').eq('coll',coll).eq('id',id).maybeSingle();if(error)throw error;return {exists:!!data,data:()=>data?data.data:undefined}},
      async set(doc){const {error}=await SB.from('items').upsert({coll,id,data:doc,by_email:ME,at:new Date().toISOString()});if(error)throw error}
    }},
    collection(name){const coll=PFX+name;return {
      onSnapshot(cb,err){
        let stop=false;
        async function pull(){
          if(stop)return;
          if(document.visibilityState!=='hidden'){
            try{const out=[];let from=0;for(;;){const {data,error}=await SB.from('items').select('id,data').eq('coll',coll).range(from,from+999);if(error)throw error;data.forEach(x=>out.push(mk(x.id,x.data)));if(data.length<1000)break;from+=1000}cb({docs:out})}
            catch(e){err&&err(e)}
          }
          setTimeout(pull,15000);
        }
        pull();
        return ()=>{stop=true};
      }
    }}
  };
  window.claude={use:async name=>{const ok=await init();if(!ok)return null;if(name==='db')return db;if(name==='user')return {id:async()=>ME,isOwner:async()=>false};return null}};
})();
</script>

ентов и определяет приоритетность обслуживания.\n Сортирует пациентов в соответствии с их срочностью и потребностью в медицинской помощи.\n Передает информацию о состоянии пациентов врачу гематологу, врачу реаниматологу;\n Мониторит состояние пациентов в приемном покое и предоставляет необходимую помощь в случае ухудшения состояния.\n Документирует информацию о пациентах и выполненных мероприятиях в МИС", "i": "", "f": "", "o": "", "t": "", "id": "mc_3b07c19c"}, {"p": "Измерение показаателей пациента при госпитализации", "d": "Измеряет температуру, рост, вес и давление пациента при госпитализации, и вносит эти данные в МИС", "i": "", "f": "", "o": "", "t": "", "id": "mc_5604de38"}, {"p": "Постоянный мониторинг показаний за состоянием пациента", "d": "Осуществляет контроль и измерение: температуры, АД , подсчет пульса, гидробаланса, сатурация", "i": "поступление пациента", "f": "врача гематолога, врача реаниматолога", "o": "раздел \"измерения\"", "t": "МИС", "id": "mc_97873e9b"}, {"p": "Оценка риска падения по шкалам", "d": "Осуществляет действия согласно СОП риск падения\n Проводит опрос по шкале Морзе, выставляет балл\n На основаниие балла выдается идентификационный браслет (красный- аллергоанамнез, синий - нет/не высокий риск, желтый -высокий риск падения)", "i": "поступление пациента", "f": "врача гематолога", "o": "Запись о статусе риска падения в МИС , браслет", "t": "МИС, браслет выдается пациенту", "id": "mc_85eea15b"}, {"p": "Обработка и профилактика пролежней", "d": "СОП «Обработка пролежней»;Алгоритм профилактики пролежней\n Проводит физическую активацию пациента;\n Использует противопролечневый матрас;\n Переворачивает пациента, меняет положение пациента по времени;\n Проводит обработку кожи", "i": "Назначения", "f": "врача гематолога, врача реаниматолога", "o": "комментарии, записи в МИС\n Процедура", "t": "МИС\n Пациент", "id": "mc_dd87882c"}, {"p": "Укомлектование процедурного столика в палатах", "d": "Дезинфецирует процедурный столик;\n Наклеиваеет идентификационные стикеры на медицинские изделия;\n Размещает: тонометр, фонендоском, термометр", "i": "Чек-лист", "f": "ДИ", "o": "Готовый процедурный столик", "t": "медицинская сестра", "id": "mc_c59565a6", "tag": "edit", "note": "Во входах и выходах упразднённые должности заменены на новые."}, {"p": "Организация гигиенических мероприятий с пациентом", "d": "Прводит разъяснительную работы пациентам по графику купания;\n Осуществляет смену постельного белья;\n Осуществляют контроль за санитарками по уходу по проведению гигиенических процедур", "i": "график", "f": "Руководитель сестринской службы", "o": "Проведенные гигиенические мероприятия", "t": "Пациент", "id": "mc_fd64d19d", "tag": "edit", "note": "Во входах и выходах упразднённые должности заменены на новые."}, {"p": "Подготовка пациента к инструментально-диагностическим исследованиям", "d": "Подготавливает пациента к следующим процедурам:\n консультация специалистов;\n к инструментальным исследованиям (УЗИ, колоноскопия, ВГДС, КТ, МРТ)\n Выполняют действия, готовят пациентов с вечера:\n УЗИ, Колоноскопия, ФГДС - выдают препарат по назначению, контролируют прием, проводят клизму; КТ, МРТ - следят об отмене питания заранее", "i": "Назначения", "f": "врача гематолога, врача реаниматолога", "o": "направление", "t": "МИС", "id": "mc_069bb14d"}]}, {"name": "Манипуляции", "items": [{"p": "Выполнение процедуры забора крови", "d": "Забор проводится, согласно СОП: \n -венозный забор крови: производится путем введения иглы в вену\n -артериальный забор крови: проводится путем введения иглы в артерию, обычно на запястье или локте\n -кровь из центрального венозного доступа: выполняется через центральный венозный катетер, введенный в крупный венозный сосуд\n Основные этапы процедуры:\n Подготовка расходных материалов, направлений для забора крови;\n Идентификация пациента;\n Обеспечение стерильности и безопасности процедуры\n Проведение асептической обработки места для забора крови\n Введение иглы в вену и сбор нужного объема крови в маркированную пробирки;\n Передача в ООЛЛ для доставки в лабораторию", "i": "Назначение на лабораторные исследования", "f": "врача гематолога, врача реаниматолога", "o": "пробирка с кровью с идентификационным стикером и направлением", "t": "Отдел организации лабораторной логистики (ООЛЛ) \n в выходные/праздничные дни - передают водителю", "id": "mc_85425252"}, {"p": "Сбор и забор биоматериала неинвазивным методом, подготовка и отправка в лабораторию", "d": "Сбор биоматериала (кал, моча, соскоб, мокрота)\nупаковывает биоматериал в соответствующие контейнеры или специальные транспортные средства, обеспечивая защиту от повреждений\n Осуществляет отправку биоматериала в лабораторию самостоятельно или по средствам отдела ООЛЛ", "i": "Назначение врача на исследование", "f": "врача гематолога, врача реаниматолога", "o": "курьер", "t": "лаборатория, другой филиал", "id": "mc_2df604b4", "tag": "merge", "note": "Объединены две функции: «Сбор биоматериала» и «Подготовка биоматериала к отправке». Внутренняя передача между медсёстрами больше не нужна."}, {"p": "Выполнение установки инфузий", "d": "Получает инфузий у медсестры отделения ГФ;\n Проверяет наличие правильных растворов, инфузионных систем, игл, шприцев и других необходимых материалов\n Проводит идентификацию пациента, подготовливает пациента, обеспечивает комфортное положение пациента, рассказывает о процедуре;\n Проводит антисептическую обработку места ввода иглы, обеспечивая стерильные условия\n Внимательно следит за точным позиционированием иглы или катетера в вену пациента;\n Настраивает инфузионную систему, чтобы обеспечить правильную скорость и объем инфузии согласно назначению врача\n Следит за состоянием пациента, контролирует его реакцию на инфузию, регулирует скорость инфузии;\n Вносит данные о проведенной инфузии", "i": "Назначение ведение \n Инфузия\n Требования инфекционной безопасности", "f": "врача гематолога, врача реаниматолога\n МС кабинета разведения (ГФ)", "o": "отметка о ведение\n Инфузия", "t": "МИС \n Пациент", "id": "mc_506ec026", "tag": "edit", "note": "Готовую инфузию медсестра получает из кабинета разведения, который переходит в фармблок."}, {"p": "Ассистирование при постановке центральновенозного катетера", "d": "Осуществляет действия согласно Руководства по установке ЦВК\n Обеспечивает чистоту и стерильность процедурной зоны Подготовить необходимые инструменты, расходные материалы и антисептики\n Предоставляет необходимые инструменты и материалы врачу во время установки ЦВК\n Наблюдает за состоянием пациента \n Оставляет запись в журнале по установке и удалению центрального венозного катетера (ЦВК),", "i": "Назначение процедуры", "f": "врач реаниматолог", "o": "Чек лист", "t": "Руководитель сестринской службы", "id": "mc_f3b9d182", "tag": "edit", "note": "Во входах и выходах упразднённые должности заменены на новые."}, {"p": "Осуществление манипуляции с центральным венозным катетером", "d": "Выполняет перевязку центрального венозного катетера в соответствии с установленными СОП;\n Проводит промывку центрального венозного катетера согласно установленным СОП; \n Оставляет запись в журнале по установке и удалению центрального венозного катетера (ЦВК),указавывая действия/ манипуляции с ЦВК", "i": "Назначение процедуры", "f": "врач реаниматолог", "o": "Чек лист", "t": "Руководитель сестринской службы", "id": "mc_c0a61ba5", "tag": "edit", "note": "Во входах и выходах упразднённые должности заменены на новые."}, {"p": "Измерение центрального венозного давления (ЦВД)", "d": "Подготавливает необходимые инструменты и приборы для измерения ЦВД, включая специальный манометр и шприц\n Пациенту объясняют процедуру измерения ЦВД и удобно размещают для проведения процедуры;\n Находит доступную центральную вену для измерения ЦВД, проводит измерение;\n Удаляет иглу или катетер из центральной вены и принимает меры по обработке и утилизации используемого оборудования;\n Результаты измерения заносит в МИС", "i": "Назначение в МИС", "f": "Врач гематолог", "o": "Внесение показателей в раздел мониторинг пациента", "t": "МИС", "id": "mc_2ba04f56"}, {"p": "Ассистирование при проведение пункции костного мозга", "d": "Накрывает манипуляционный стол, готовит необходимые инструменты и материалы (игла для трепана, препараты для анестезии);\n Предоставляет необходимые инструменты и материалы врачу во время пункции Она помогает врачу подготовить пациента, держит инструменты, подает необходимые препараты и анестетики, соблюдая стерильность;\n Помогает пациенту раздеться и принять правильное положение для процедуры;\n Следит за состоянием пациента во время процедуры;\n Предоставляет пациенту необходимую информацию о дальнейшем уходе за раной и оказывает поддержку и помощь при необходимости\n Передает материал в ООЛЛ", "i": "Назначение процедуры", "f": "Врач гематолог", "o": "мазок костного мозга, направдение, таймаут", "t": "Отдел организации лабораторной логистики", "id": "mc_a3e5b5e4"}, {"p": "Ассистирование при проведение трепанобиопсии", "d": "Накрывает манипуляционный стол, готовит необходимые инструменты и материалы (игла для трепана, препараты для анестезии);\n Предоставляет необходимые инструменты и материалы врачу во время пункции Она помогает врачу подготовить пациента, держит инструменты, подает необходимые препараты и анестетики, соблюдая стерильность;\n Помогает пациенту раздеться и принять правильное положение для процедуры;\n Следит за состоянием пациента во время процедуры;\n Предоставляет пациенту необходимую информацию о дальнейшем уходе за раной и оказывает поддержку и помощь при необходимости\n Передает материал в ООЛЛ", "i": "Назначение процедуры", "f": "Врач гематолог", "o": "Взятый биоматериал , трепонобиоптат, направление , таймаут", "t": "Лаборатория (Центр гематологии) Передает на прямую лаборатории для заготовки материала к дальнейшей транспортировки", "id": "mc_50f15d07"}, {"p": "Постановка мочевого катетера", "d": "СОП \"Поставнока мочевого катетера\"\n Проверяет наличиерасходные материалы (катетер, антисептические растворы, перчатки, стерильные компрессы и мочевой пакет);\n Объясняет процедуру пациенту;\n Моет и обрабатывает руки антисептическим раствором, выполняет постановку мочевого катетера;\n Проверяет, что мочеиспускание происходит без проблем и нет утечек;\n Обеспечивает правильную фиксацию катетера, а также подсоединяет мочевой пакет для сбора мочи", "i": "Назначения", "f": "врача гематолога, врача реаниматолога", "o": "комментарии, записи в МИС\n Катетер", "t": "МИС\n Пациент", "id": "mc_bd1fa917"}, {"p": "Проведение процедур клизмы", "d": "СОП «Клизма послаблящая»\n Подготавливает расходные материалы;\n Готовит раствора для клизмы;\n Заполняет клизменного баллона раствором;\n Водит конец шланга от в прямую кишку;\n Контролирует медленного ведения раствора;\n Проводит массаж живота пациента для распределения раствора;\n Направляет пациента в санузел для опорожнения кишечника;\n Обеспечивает уединение пациента", "i": "Назначения", "f": "врача гематолога, врача реаниматолога", "o": "комментарии, записи в МИС\n Процедура", "t": "МИС\n Пациент", "id": "mc_0bd5a439"}, {"p": "Проведение неинвазивных манипуляции", "d": "Оксигенация: предоставляет пациенту оксигинатор с Сипап -маско;\n ЭКГ- подключают к аппарату ЭКГ- контролирует запись - отключает- передает запись врачу;\n Ингаляция- разводит препарат в небулайзер -предоставляет пациенту небулайзер с индивидуальной маской;", "i": "Назначения", "f": "врача гематолога, врача реаниматолога", "o": "комементарии, записи в МИС", "t": "МИС", "id": "mc_5306ffd3"}, {"p": "Дезинфекция многоразового инструментария", "d": "Помещаются в контейнер с водой, где они проходят предварительное промывание для удаления видимых загрязнений\n После предварительной обработки инструменты помещаются в контейнер с дезинфицирующим раствором и выдерживает время экспазиции;\n После дезинфекции инструменты упаковываются в крафтупаковку или другую соответствующую упаковку для сохранения их стерильности Упаковка маркируется с указанием даты дезинфекции и других необходимых данных для обеспечения контроля над процессом и безопасности", "i": "Процедура дезинфекции многоразовых инструментов", "f": "Санитарные правила Приказ 68 МЗ РК", "o": "стерильный инструментарий в крафт упаковке с маркировкой (дата . время)", "t": "манипуляционный кабинет\n для использования другими медицинскмими сестрами", "id": "mc_653525d6"}, {"p": "Участие в генеральной уборке процедурного и манипуляционного кабинетов", "d": "Действия согласно СОП", "i": "График генеральных уборок", "f": "медицинская сестра инфекционного контроля", "o": "Журнал генеральных уборок", "t": "медицинская сестра инфекционного контроля, Руководитель сестринской службы", "id": "mc_c6d4b8e4", "tag": "new", "note": "Возвращено из старой матрицы: функция была у медсестёр, но выпала при инвентаризации."}]}, {"name": "ОИТ и трансфузия", "items": [{"p": "Подготовка трансфузионного кабинета и инструментария", "d": "Проверяет: \n наличие перевязочного материала;\n наличие расходного материала (шприцы, системы, перчатки, лотки, пинцеты и тд);\n исправность аппаратуры;\n наличие и комплектацию набора «антиспид»\n наличие дезинфицирующих средств", "i": "СОПы по трансфузионной терапии (Об утверждении номенклатуры, правил заготовки, переработки, контроля качества, хранения, реализации крови, ее компонентов, а также правил переливания крови, ее компонентов\n Приказ Министра здравоохранения Республики Казахстан от 20 октября 2020 года № ҚР ДСМ - 140/2020.", "f": "ДИ\n Инструкции\n Чек-листы", "o": "Материалы и оборудование", "t": "Руководитель сестринской службы", "id": "mc_da427911", "tag": "edit", "note": "Во входах и выходах упразднённые должности заменены на новые."}, {"p": "Проведение трансфузии", "d": "Согласно СОП по трансфузионной терапии:\n Формирует заявки на компоненты крови;\n Осуществляет доставку, регистрацию , хранение компонентов крови;\n Готовит среды;\n Проведит и ассистирует врачу трансфузиологу при проведение (биологической, совместимости) проб;\n Осуществл \n Средний и младший персонал", "id": "ik_93d071cf"}, {"p": "Осуществление контроля за соблюдением санитарно-гигиенического состояния помещений филиала", "d": "Осуществляет регулярные обходы, проверяет чистоту и состояние помещений;\n Следит за наличием необходимого оборудования, расходных материалов (мыло, салфетки, антисептик, туалетная бумага)", "i": "Фактическое санитарное состояние помещений\n Их оснащенность расходными материалами (мыло, салфетки, антисептик, туалетная бумага, дезинфицирующие средства )", "f": "ДИ", "o": "Чек-лист", "t": "Директор филиала, Заместитель директора СД и ИК", "id": "ik_3bfe7144"}, {"p": "Проведение обучения и инструктажей по инфекционной безопасности", "d": "Проводит обучения и инструктажей по инфекционной безопасности для нового сотрудника/ сотрудника участника инцидента , связанного с нарушением ИК, при внедрение нового СОП по ИК;\n Объясняет и демонстрирует правильные методы мытья рук, использования СИЗ, обработки и стерилизации инструментов, а также соблюдения режимов изоляции пациентов", "i": "Материалы для инструктажа НПА,СОП АЛГОРИТМЫ", "f": "Консультант по качеству,менеджер по качеству (отвечает за все СОП в организации)", "o": "Знания (инструкции, нормы и правила) по инфекционной безопасности на работе\n Результаты экзамена\n Подпись в Журнале инструктажей", "t": "Новый сотрудник (медицинская сестра, санитарок)\n Оценка в Листе адаптации\n Директор филиала, Заместитель директора СД и ИК", "id": "ik_0785b2a0"}, {"p": "Ведение журнала по установке и удалению центрального венозного катетера (ЦВК)", "d": "Регистрирует установку ЦВК в журнале, указывая дату установки, данные пациента, тип и место установки катетера;\n Регистрирует удаление ЦВК в журнале, указывая дату удаления, данные пациента, причину удаления катетера (например, завершение лечения, возникновение осложнений и т д)", "i": "Назначение", "f": "врач гематолог, врач реаниматолог", "o": "Регистрация в электронном журнале ЦВК", "t": "Врач реаниматолог", "id": "ik_16d0d058"}, {"p": "Ведение журнала по регистрации бактериальных посевов пациентов", "d": "Регистрирует основные данные пациента, такие как ФИО, возраст, пол, диагноз, медицинскую историю и другую информацию, необходимую для идентификации пациента;\n Отмечает в журнале дату, когда был взят образец у пациента;\n Указывает тип образца, взятого у пациента (кровь, моча, мокрота);\n Вносит результаты бакпосевов с указанием антибиотикорезистентности и чувствительности", "i": "Назначение", "f": "врач гематолог, \n врач реаниматолог", "o": "запись в электронном Журнал анализа результатов бак.исследований", "t": "члены комиссии по инфекционному контролю (далее КИК)", "id": "ik_78f91b67"}, {"p": "Ведение журанала по регистрации бактериальных посевов сотрудников", "d": "Регистрирует данные сотрудника ФИО, возраст, пол, должность;\n Отмечает в журнале дату, когда был взят образец;\n Указывает тип образца, у сотрудника (кровь, моча, мокрота);\n Вносит результаты бакпосевов;\n В случае положительного результата бакпосева сотрудника, проводит корретирующие мероприятия (направление в поликлинику, выдает средства для сонации дыхательных путей, назначает обязательное ношение маски)", "i": "Протокол комиссии по инфекционной безопасности (далее КИК)", "f": "Медицинская сестра инфекционного контроля", "o": "запись в электронном Журнале регистрации результатов производственного контроля\"", "t": "члены комиссии по инфекционному контролю (далее КИК)", "id": "ik_081f81ae"}, {"p": "Предоставление ежемесячного отчета на заседания комиссии по инфекционному контролю", "d": "Вносить данные в установленную форму отчета КИК, проведение анализа отчета;\n Демонстрация отчета на заседание КИК", "i": "График КИК", "f": "Секретарь КИК", "o": "Отчет", "t": "члены комиссии по инфекционному контролю (далее КИК)", "id": "ik_470928af"}, {"p": "Организации и проведения производственного контроля", "d": "Разработка программы производственного контроля;\n Осуществление (организацию) лабораторных исследований и замеров в случаях, установленных документами нормирования;\n Подает заявки исследование смывов в баклабораторию\n Сопровождает лаборантов баклаборатории и контролирует за проведение заборов;\n Получает результатов бакисследований;\n Регистрация в журнале регистрации производственного контроля;\n Ежемесячно проводит анализ по результатам , отчет предоставляет КИК", "i": "СОП по проведению производственного контроля (график)", "f": "КИК", "o": "результаты смывов, записи в журанале регистрации Журнал регистрации результатов производственного контроля", "t": "члены комиссии по инфекционному контролю (далее КИК), \n проверяющие органы (СЭС), врач эпидемиолог", "id": "ik_ece162a4"}, {"p": "Осуществляет контроль за очисткой вентиляционной/кондиционерных системы", "d": "Назначает дезинфицирующее средства (при химическом методе дезинфекции);\n Проводит расчет потребности в дезинфицирующих средствах для дезинфекции поверхностей систем вентиляции и кондиционирования воздуха;\n Оповещает заместителя директора по леч-проф работе о сроках проведения и объеме работ по очистке и дезинфекции системы вентиляции и кондиционирования воздуха, мерах предосторожности;\n Контролирует проведения санитарками клининг демонтажа (при необходимости) системы вентиляции и кондиционирования воздуха;\n Контролирует проведение очистки санитарками по клинингу;\n Регистрирует очистку в Журнал регистрации очистки системы вентиляции и кондиционирования воздуха", "i": "СанПин Мз РК 01.09.2021 № ҚР ДСМ-95\n Объекты здравоохранения:\n 1) системы местной вытяжной и местной приточной вентиляции – 1 раз в год;\n \n 2) системы общеобменной механической и естественной вентиляции – 1 раз в 3 года.", "f": "Приказ МЗ РК (№131) от МЗ РК", "o": "запись в бумажном журнале по очистке вентиляционных систем и кондиционеров", "t": "Руководитель сестринской службы, \n проверяющие органы (СЭС)", "id": "ik_388ede86", "tag": "edit", "note": "Во входах и выходах упразднённые должности заменены на новые."}, {"p": "Осуществление контроля за качеством уборкой в отделении", "d": "Выполняет проверку качества текущих уборок в отделении Проводит осмотр помещений с целью оценки чистоты и санитарного состояния, проверку соблюдения СОП по текущей уборке;\n Проводит оценку чек- листов по текущей уборки, выявление дефектов и сравнение данных (указано /не указано)", "i": "Фактическое качество уборки", "f": "Сестра-хозяйка", "o": "Чек-лист\n уведомление в рабочий чат (в случае выявленных дефектов)", "t": "директор филиала", "id": "ik_84ad6fb1"}, {"p": "Составление графика проведения генеральных уборок отделения", "d": "Формирует график проведения генеральных уборок;\n Печатает, ламинирует документ;\n Размещает в санитарной комнате;\n Внесит отметку о проведении генеральной уборки в в гугл-календарь", "i": "Шаблон графика , Санитарные правила", "f": "СанПин", "o": "утвержденный график генеральных уборок", "t": "санитарки- клининг, все медицинские сетсра,старшие медицинские сестра блоков\n предоставление органам СЭС по требованию", "id": "ik_4e53583d"}, {"p": "Осуществление проверки пригодности уборочного инвентаря", "d": "Определение необходимости замены или ремонта инвентария, проверка наличия маркировки инвентаря\n Проверяет наличие маркировки на уборочном инвентаре (емкости уборочного комбайна, ветошь)\n Проверяет санитарок по клинингу процедуры по оборащению с инвентарем: применять строго по назначению, дезинфицировать после применения и затем просушивать (согласно требованиям законодательных актов)", "i": "Фактическое состояние уборочного инвентаря\n Наличие маркировки", "f": "ДИ", "o": "уведомление в рабочий чат, акт поломки,замены", "t": "Сестра хозяйка должна дать информацию ,менеджер по закупу и Руководитель сестринской службы", "id": "ik_4408b6f3", "tag": "edit", "note": "Во входах и выходах упразднённые должности заменены на новые."}, {"p": "Контролирование и организация заключительной уборки с акцентом на дезинфекцию", "d": "По согласованию с врачом гематологом и заместителем директором по се const pid=n=>'p'+Array.from(n).reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7).toString(36);
const short=n=>{const w=String(n).replace(/\(.*?\)\s*/,'').split(/\s+/);return w[0]+(w[1]?' '+w[1][0]+'.':'')+(w[2]&&w[2].length>2?w[2][0]+'.':'')};
const ym=()=>S.y+'-'+String(S.m+1).padStart(2,'0');
const mkey=()=>S.br+'_'+ym();
const cfg=()=>CFG[S.br]||(CFG[S.br]=defCfg(S.br));
const mon=()=>MON[mkey()]||{p:{},nar:{}};
const touch=()=>{const k=mkey();if(!MON[k])MON[k]={p:{},nar:{}};if(!MON[k].nar)MON[k].nar={};if(!MON[k].p)MON[k].p={};return MON[k]};
const days=()=>new Date(S.y,S.m+1,0).getDate();
const wday=d=>new Date(S.y,S.m,d).getDay();
const isHol=d=>HOL.includes(String(S.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
const isWE=d=>{const w=wday(d);return w===0||w===6||isHol(d)};
const mins=t=>{const[a,b]=String(t||'0:0').split(':').map(Number);return (a||0)*60+(b||0)};
const dur=(a,b)=>{let x=mins(b)-mins(a);if(x<=0)x+=1440;return x/60};
function hrs(c,s){if(c==='Д')return Math.max(0,dur(s.ds,s.de)-s.brk);if(c==='Н')return Math.max(0,dur(s.ns,s.ne)-s.brk);if(c==='8')return 8;return 0}
function normDef(){let n=0;for(let d=1;d<=days();d++){if(!isWE(d))n+=8}return n}
const normM=()=>{const M=mon();return M.norm!=null?M.norm:normDef()};
function bal(p,L){let ab=0;for(let d=1;d<=days();d++){const x=code(p,L,d);if((x==='О'||x==='Б')&&!isWE(d))ab++}return Math.round((+p.r||1)*(normM()-8*ab)*10)/10}
function phrs(p,L){let h=0;const c=cfg();for(let d=1;d<=days();d++)h+=hrs(code(p,L,d),c);return h}
const fm=x=>String(Math.round(x*10)/10).replace('.',',');
function bstate(df,sh){return df>12?'over':df>0?'over1':df<=-2*sh?'under':'ok'}
function balMsg(p,L){const h=phrs(p,L),b=bal(p,L),df=h-b,sh=hrs('Д',cfg())||11;
  if(df>12)return {k:'r',t:`${short(p.n)}: ${fm(h)} ч при балансе ${fm(b)} — +${fm(df)} ч. Это больше лимита сверхурочных 12 ч в месяц: уберите ${Math.ceil((df-12)/sh)} смен(ы) или передайте их другой сестре.`};
  if(df>0)return {k:'r',t:`${short(p.n)}: ${fm(h)} ч при балансе ${fm(b)} — +${fm(df)} ч сверх баланса. Уберите смену или оформите сверхурочные с письменного согласия.`};
  if(df<=-2*sh)return {k:'y',t:`${short(p.n)}: ${fm(h)} ч при балансе ${fm(b)} — недобор ${fm(-df)} ч, можно поставить ещё ${Math.floor(-df/sh)} смен(ы).`};
  return null}

/* ---- people ---- */
function people(grp){
  const B=STAFF[S.br]||{}, c=cfg();
  let L=(B[grp]||[]).map(x=>({n:x.n,r:x.r,o:x.o,note:x.note,grp}));
  (c.extra[grp]||[]).forEach(n=>L.push({n,r:1,o:'добавлена вручную',note:'',grp,added:1}));
  L=L.filter(x=>!c.gone[pid(x.n)]);
  if(grp==='mc')(B.ik||[]).forEach(x=>L.push({n:x.n,r:x.r,o:x.o,grp,ik:1}));
  return L.map(x=>Object.assign(x,{id:pid(x.n)}));
}
function hasDop(p,k){if(p.ik)return false;const d=cfg().dop[p.id];if(d&&d[k]!=null)return !!d[k];
  if(k==='tr')return /трансфуз/i.test(p.o||'');return true}
function zones(grp,sh){return ((cfg().zones[grp]||{})[sh])||[]}
function nar(d){const M=mon();return (M.nar&&M.nar[d])||{}}
function isOpen(d,z){return !z.sit||!!((nar(d).open||{})[z.id])}
function activeZones(grp,sh,d){return zones(grp,sh).filter(z=>isOpen(d,z))}

/* ---- brigades ---- */
function brigadeDefault(L,grp){
  const c=cfg(), keys=Object.keys(SCH[c.scheme].br), D=zones(grp,'day').filter(z=>!z.sit).length, N=zones(grp,'night').filter(z=>!z.sit).length;
  const ord=[...L.filter(p=>!p.ik&&hasDop(p,'tr')),...L.filter(p=>!p.ik&&!hasDop(p,'tr'))];
  const tgt=c.scheme==='sep'?{'Д1':D,'Д2':D,'Н1':N,'Н2':N}:Object.fromEntries(keys.map(k=>[k,Math.max(D,N)]));
  const cnt=Object.fromEntries(keys.map(k=>[k,0])), trc=Object.fromEntries(keys.map(k=>[k,0])), out={};
  ord.forEach(p=>{
    let best=null,bv=1e9;
    keys.forEach(k=>{if(!tgt[k])return;let v=cnt[k]/tgt[k];if(hasDop(p,'tr')&&k.startsWith('Д'))v+=trc[k]*2;if(c.scheme==='sep'&&hasDop(p,'tr')&&k.startsWith('Н'))v+=5;if(v<bv-1e-9){bv=v;best=k}});
    out[p.id]=best||keys[0];cnt[out[p.id]]++;if(hasDop(p,'tr'))trc[out[p.id]]++;
  });
  return out;
}
let BDEF={};
function brigade(p,L){
  if(p.ik)return '5/2';
  const b=(mon().p[p.id]||{}).b, keys=Object.keys(SCH[cfg().scheme].br);
  if(b&&(keys.includes(b)||b==='5/2'||b==='—'))return b;
  if((+p.r||1)<0.5||cfg().scheme==='free')return '—';
  const k=S.br+'|'+p.grp+'|'+cfg().scheme+'|'+L.length;
  if(!BDEF[k])BDEF[k]=brigadeDefault(L,p.grp);
  return BDEF[k][p.id]||keys[0];
}
function auto(b,d){
  if(b==='—')return '';
  if(b==='5/2')return isWE(d)?'В':'8';
  const p=SCH[cfg().scheme].br[b];if(!p)return '';
  const idx=Math.round((Date.UTC(S.y,S.m,d)-ANCHOR)/864e5);
  return p[(((idx+p[4])%4)+4)%4];
}
function code(p,L,d){const x=(mon().p[p.id]||{}).x||{};return x[d]!=null?x[d]:auto(brigade(p,L),d)}
function onShift(grp,sh,d){const L=people(grp);return L.filter(p=>!p.ik&&(sh==='day'?['Д','8'].includes(code(p,L,d)):code(p,L,d)==='Н'))}
function setCode(p,d,c){const M=touch();M.p[p.id]=M.p[p.id]||{};M.p[p.id].x=M.p[p.id].x||{};const L=people(p.grp);if(c===auto(brigade(p,L),d))delete M.p[p.id].x[d];else M.p[p.id].x[d]=c}

/* ---- save / sync ---- */
function saveMon(){const k=mkey();dirty[k]=1;clearTimeout(tm[k]);tm[k]=setTimeout(async()=>{if(db){try{await db.doc('mon/'+k).set(Object.assign({},MON[k],{t:Date.now()}))}catch(e){toast('Не сохранилось: нет права редактировать или нет связи')}}delete dirty[k]},500)}
function saveCfg(){const b=S.br,k='c_'+b;dirty[k]=1;clearTimeout(tm[k]);tm[k]=setTimeout(async()=>{if(db){try{await db.doc('cfg/'+b).set(Object.assign({},CFG[b],{t:Date.now()}))}catch(e){toast('Настройки не сохранились')}}delete dirty[k]},500)}
function status(){if(window.REV&&REV.owns(tab())){$('st').textContent='Функционал: оценки старших медсестёр';return}$('st').textContent=dbState==='on'?'Сохраняется в общей базе, коллеги видят изменения в течение 15 секунд':dbState==='off'?'Черновик на этом устройстве: войдите в «Функционал», чтобы сохранять для всех':'Подключаюсь…'}

/* ---- наряд ---- */
function counts(grp,zid,uptoD,sh){let n=0;const M=mon();for(let d=1;d<uptoD;d++){const a=((M.nar||{})[d]||{})[grp+'_'+sh]||{};Object.entries(a).forEach(([z,p])=>{if(z===zid)n++})}return n}
function lastSame(grp,sh,zid,d,p){let run=0;for(let k=d-1;k>=1&&k>=d-3;k--){const a=(nar(k)[grp+'_'+sh]||{});if(a[zid]===p)run++;else break}return run}
function autoAssign(d,sh,grp){
  const M=touch(); M.nar[d]=M.nar[d]||{}; const key=grp+'_'+sh;
  const ppl=onShift(grp,sh,d), zs=activeZones(grp,sh,d), A={}, used=new Set();
  const order=[...zs].sort((a,b)=>ppl.filter(p=>hasDop(p,a.k)).length-ppl.filter(p=>hasDop(p,b.k)).length);
  order.forEach(z=>{
    const cand=ppl.filter(p=>!used.has(p.id)&&hasDop(p,z.k)).map(p=>({p,s:counts(grp,z.id,d,sh)*0+zoneCount(grp,sh,z.id,p.id,d)*10+lastSame(grp,sh,z.id,d,p.id)*100}));
    cand.sort((a,b)=>a.s-b.s);
    if(cand.length){A[z.id]=cand[0].p.id;used.add(cand[0].p.id)}
  });
  M.nar[d][key]=A;
  if(grp!=='san'){const sk=grp==='mc'?'st_'+sh:'st_'+grp+'_'+sh;const st=ppl.filter(p=>used.has(p.id)&&hasDop(p,'st'));const pick=st.sort((a,b)=>stCount(sk,a.id,d)-stCount(sk,b.id,d))[0];M.nar[d][sk]=pick?pick.id:(ppl.find(p=>used.has(p.id))||{}).id||null}
}
function zoneCount(grp,sh,zid,id,d){let n=0;for(let k=1;k<d;k++){if((nar(k)[grp+'_'+sh]||{})[zid]===id)n++}return n}
function stCount(sk,id,d){let n=0;for(let k=1;k<d;k++){if(nar(k)[sk]===id)n++}return n}
function assigned(d,sh,grp){return nar(d)[grp+'_'+sh]||{}}
function shortage(d){let s=0;['day','night'].forEach(sh=>GRPS().forEach(g=>{s+=Math.max(0,activeZones(g,sh,d).length-onShift(g,sh,d).length)}));return s}
function canCall(p,L,d,sh){const c=code(p,L,d);if(c!=='В'&&c!=='')return false;if(sh==='day'&&d>1&&code(p,L,d-1)==='Н')return false;if(sh==='night'&&d<days()&&['Д','8'].includes(code(p,L,d+1)))return false;return true}

function grpBlock(d,sh,grp){
  const ppl=onShift(grp,sh,d), zs=zones(grp,sh), A=assigned(d,sh,grp), byId=Object.fromEntries(people(grp).map(p=>[p.id,p]));
  const act=zs.filter(z=>isOpen(d,z)), used=new Set(Object.values(A));
  let h=`<div class="grp"><div class="gt">${GN[grp]} · ${ppl.length} в смене</div>`;
  act.forEach(z=>{
    const cur=A[z.id]||'', p=byId[cur], nod=p&&!hasDop(p,z.k);
    const reason=z.sit?((nar(d).open||{})[z.id]||''):'';
    h+=`<div class="zone"><div class="zn">${esc(z.n)}${z.sit?`<span class="sit">ситуативно</span>`:''}${reason?`<small>${esc(reason)}</small>`:''}</div><div class="zs"><select id="z-${d}-${sh}-${grp}-${z.id}" data-zone="${sh}|${grp}|${z.id}" class="${!cur?'empty':nod?'nodop':''}" aria-label="${esc(z.n)}"><option value="">— никого —</option>${ppl.map(q=>`<option value="${q.id}"${q.id===cur?' selected':''}>${esc(short(q.n))}${!hasDop(q,z.k)?' · нет допуска':''}${used.has(q.id)&&q.id!==cur?' · занята':''}</option>`).join('')}</select>${z.sit?`<button type="button" class="x" data-close="${sh}|${z.id}" aria-label="Закрыть ${esc(z.n)}">✕</button>`:''}</div></div>`;
  });
  if(grp!=='san'){
    const sk=grp==='mc'?'st_'+sh:'st_'+grp+'_'+sh, st=nar(d)[sk]||'';
    h+=`<div class="zone st"><div class="zn">Старшая по смене<small>одна из сестёр наряда, с доплатой</small></div><div class="zs"><select id="st-${d}-${sh}-${grp}" data-st="${sk}" class="${!st?'empty':''}" aria-label="Старшая по смене"><option value="">— не назначена —</option>${ppl.map(q=>`<option value="${q.id}"${q.id===st?' selected':''}>${esc(short(q.n))}${!hasDop(q,'st')?' · нет допуска':''}</option>`).join('')}</select></div></div>`;
  }
  const free=ppl.filter(p=>!used.has(p.id));
  if(free.length) h+=`<div class="free">Без зоны, резерв на смену: <b>${free.map(p=>esc(short(p.n))).join(', ')}</b></div>`;
  const miss=act.length-ppl.length;
  if(miss>0){
    const L=people(grp), cands=L.filter(p=>!p.ik&&canCall(p,L,d,sh)).slice(0,8);
    h+=`<div class="warn">Не хватает ${miss} ${GNG[grp]} на открытые зоны.</div>${cands.length?`<div class="free">Можно вызвать из выходного:</div><div class="chips">${cands.map(p=>{const after=phrs(p,L)+(hrs(sh==='day'?'Д':'Н',cfg())),df=after-bal(p,L);return `<button type="button" class="chip call${df>0?' hot':''}" data-call="${sh}|${grp}|${p.id}" title="${df>0?'После вызова будет +'+fm(df)+' ч сверх баланса':'В пределах баланса'}">+ ${esc(short(p.n))}${df>0?' · +'+fm(df)+' ч':''}</button>`}).join('')}</div>`:''}`;
  }
  const closed=zs.filter(z=>z.sit&&!isOpen(d,z));
  if(closed.length) h+=`<div class="chips" style="margin-top:8px">${closed.map(z=>`<button type="button" class="chip" data-open="${sh}|${z.id}">+ Открыть: ${esc(z.n)}</button>`).join('')}</div>`;
  if(S.p3&&S.p3.d===d&&S.p3.sh===sh&&zs.some(z=>z.id===S.p3.z)){
    const z=zs.find(z=>z.id===S.p3.z);
    h+=`<div class="p3form"><b>${esc(z.n)}:</b> причина ${REASONS.map(r=>`<button type="button" class="chip" data-reason="${esc(r)}">${esc(r)}</button>`).join('')}<button type="button" class="x" data-p3cancel="1" aria-label="Отмена">✕</button></div>`;
  }
  return h+'</div>';
}
function naryadView(){
  const D=days(); if(S.d>D)S.d=D;
  const d=S.d, c=cfg(), ik=(STAFF[S.br]||{}).ik||[];
  let h=`<div class="strip" id="strip" role="group" aria-label="Дата">`;
  for(let k=1;k<=D;k++){const sh=shortage(k),p3=Object.keys(nar(k).open||{}).length;h+=`<button type="button" data-day="${k}" class="${isWE(k)?'we':''}" aria-pressed="${k===d}"><b>${k}</b><small>${WD[wday(k)]}</small>${sh?'<i class="bad"></i>':p3?'<i class="p3"></i>':''}</button>`}
  h+=`</div><div class="dayhead"><h2>${d} ${MON_G[S.m]}, ${WDF[wday(d)]}</h2>${ik.length?`<span class="ik">Инфекционный контроль: ${esc(short(ik[0].n))}, ${isWE(d)?'выходной':'08:00–17:00, 8 ч'}</span>`:''}
   <div class="acts"><button type="button" class="btn pri" data-auto="1">Расставить автоматически</button><button type="button" class="btn" data-copy="1">Скопировать наряд</button><button type="button" class="btn terra" data-clear="1">Очистить день</button></div></div>`;
  const board=(sh,t,tm)=>{const G=GRPS(), need=G.reduce((a,g)=>a+activeZones(g,sh,d).length,0), have=G.reduce((a,g)=>a+onShift(g,sh,d).length,0), filled=G.reduce((a,g)=>{const A=assigned(d,sh,g);return a+activeZones(g,sh,d).filter(z=>A[z.id]).length},0);
    return `<section class="board ${sh}"><div class="bh"><span class="ico" aria-hidden="true">${sh==='day'?'☀':'☾'}</span><div><h3>${t}</h3><div class="tm">${tm}</div></div><span class="cnt ${have<need||filled<need?'bad':'ok'}">зон ${filled}/${need} · людей ${have}</span></div>${G.map(g=>grpBlock(d,sh,g)).join('')}</section>`};
  h+=`<div class="boards">${board('day','Дневная смена',c.ds+'–'+c.de)}${board('night','Ночная смена',c.ns+'–'+c.ne)}</div>`;
  h+=`<p class="legend">В выпадающем списке только те, кто по графику работает в эту смену. Пост 3 и другие ситуативные зоны открываются кнопкой «Открыть», когда пациент затяжелел или есть агранулоцитоз. Правило: не больше 2–3 смен подряд в одном кабинете — автоматическая расстановка это учитывает.</p>`;
  return h;
}
function copyText(){
  const d=S.d, byId={};GRPS().forEach(g=>people(g).forEach(p=>byId[p.id]=p));
  let t=`Наряд ${S.br} на ${d} ${MON_G[S.m]}\n`;
  [['day','День '+cfg().ds+'–'+cfg().de],['night','Ночь '+cfg().ns+'–'+cfg().ne]].forEach(([sh,tt])=>{
    t+=`\n${tt}\n`;const st=nar(d)['st_'+sh];if(st&&byId[st])t+=`Старшая по смене: ${short(byId[st].n)}\n`;
    GRPS().forEach(g=>activeZones(g,sh,d).forEach(z=>{const p=byId[assigned(d,sh,g)[z.id]];t+=`${g==='san'?'Санитарка — ':''}${z.n}: ${p?short(p.n):'—'}\n`}));
  });
  return t;
}

/* ---- grid ---- */
function gridView(){
  if(!GRPS().includes(S.grp))S.grp='mc';
  const c=cfg(), L=people(S.grp), D=days(), M=mon(), norm=M.norm!=null?M.norm:normDef(), sh=hrs('Д',c)||11;
  const rows=L.map(p=>{const cs=[];let h=0;for(let d=1;d<=D;d++){const x=code(p,L,d);cs.push(x);h+=hrs(x,c)}const rest=[];for(let d=1;d<D;d++)if(cs[d-1]==='Н'&&['Д','8'].includes(cs[d]))rest.push(d+1);return {p,cs,h,rest,b:brigade(p,L),ov:(M.p[p.id]||{}).x||{},bl:bal(p,L)}});
  const cov=[];for(let d=1;d<=D;d++){let a=0,b=0;rows.forEach(r=>{if(r.p.ik)return;if(['Д','8'].includes(r.cs[d-1]))a++;if(r.cs[d-1]==='Н')b++});cov.push([a,b,activeZones(S.grp,'day',d).length,activeZones(S.grp,'night',d).length])}
  const sd=cov.filter(x=>x[0]<x[2]).length, sn=cov.filter(x=>x[1]<x[3]).length, over=rows.filter(r=>!r.p.ik&&r.h-r.bl>0).length, restN=rows.reduce((a,r)=>a+r.rest.length,0);
  const Dz=zones(S.grp,'day').filter(z=>!z.sit).length, Nz=zones(S.grp,'night').filter(z=>!z.sit).length, need=Math.ceil((Dz+Nz)*D/(norm/sh)*1.1);
  let h=`<div class="gbar"><div class="seg2" role="group" aria-label="Персонал">${GRPS().map(g=>`<button type="button" data-grp="${g}" aria-pressed="${S.grp===g}">${{mc:'Медсёстры',pit:'ПИТ',san:'Санитарки'}[g]}</button>`).join('')}</div><span class="legend" style="margin:0">${esc(SCH[c.scheme].name)} · норма ${norm} ч</span></div>
  <div class="kpis"><div class="kpi ${rows.filter(r=>!r.p.ik).length<need?'bad':'good'}"><b>${rows.filter(r=>!r.p.ik).length} / ${need}</b><span>в графике / нужно на постоянные зоны с резервом 10%</span></div>
  <div class="kpi ${sd+sn?'bad':'good'}"><b>${sd} / ${sn}</b><span>дней с нехваткой: днём / ночью</span></div>
  <div class="kpi ${over?'bad':'good'}"><b>${over}</b><span>выше баланса рабочего времени</span></div>
  <div class="kpi ${restN?'bad':'good'}"><b>${restN}</b><span>отдых между сменами меньше 12 ч</span></div></div>
  ${hintsHtml(rows)}
  <div class="gwrap"><table class="g"><thead><tr><th class="nm">Сотрудник</th><th>Бригада</th>`;
  for(let d=1;d<=D;d++)h+=`<th class="dh${isWE(d)?' we':''}${S.d===d?' sel':''}" data-gday="${d}" title="Открыть наряд на ${d} ${MON_G[S.m]}">${d}<small>${WD[wday(d)]}</small></th>`;
  h+=`<th class="hh">Часы<br>из баланса</th></tr></thead><tbody>`;
  const opts=b=>[...Object.keys(SCH[c.scheme].br),'5/2','—'].map(k=>`<option${k===b?' selected':''}>${k}</option>`).join('');
  rows.forEach(r=>{
    h+=`<tr class="${r.p.ik?'fixed':''}"><td class="nm" title="${esc(r.p.n)}">${esc(short(r.p.n))}${r.p.ik?' · ИК':''}</td><td class="bg">${r.p.ik?'5/2':`<select id="b-${r.p.id}" data-b="${r.p.id}" aria-label="Бригада">${opts(r.b)}</select>`}</td>`;
    r.cs.forEach((x,k)=>{const d=k+1;h+=`<td class="c ${CLS[x]||''}${isWE(d)?' we':''}${r.ov[d]!=null?' ov':''}${r.rest.includes(d)?' rest':''}${S.d===d?' selc':''}" data-cell="${r.p.id}|${d}">${x==='В'?'·':esc(x)}</td>`});
    const df=r.h-r.bl, st=bstate(df,sh), m=balMsg(r.p,L);
    h+=`<td class="h ${st}" title="${esc(m?m.t:'В пределах баланса рабочего времени')}"><b>${fm(r.h)} / ${fm(r.bl)}</b><small>${df>0?'+':''}${fm(df)} ч</small></td></tr>`;
  });
  h+=`</tbody><tfoot><tr class="f1"><td class="nm">Днём / нужно</td><td class="bgf"></td>${cov.map(x=>`<td class="${x[0]<x[2]?'short':'okc'}">${x[0]}/${x[2]}</td>`).join('')}<td class="hf"></td></tr><tr class="f2"><td class="nm">Ночью / нужно</td><td></td>${cov.map(x=>`<td class="${x[1]<x[3]?'short':'okc'}">${x[1]}/${x[3]}</td>`).join('')}<td class="hf"></td></tr></tfoot></table></div>
  <div class="legend"><span><i class="c D">Д</i>день ${c.ds}–${c.de}, ${hrs('Д',c)} ч</span><span><i class="c N">Н</i>ночь ${c.ns}–${c.ne}, ${hrs('Н',c)} ч</span><span><i>·</i>выходной</span><span><i class="c O">О</i>отпуск</span><span><i class="c B">Б</i>больничный</span><span><i class="c E">8</i>8 часов</span><span>Нажмите на клетку, чтобы поменять смену; на число — откроется наряд этого дня.</span><span>Баланс = ставка × норма месяца минус рабочие дни отпуска и больничного по 8 ч.</span></div>`;
  return h;
}
function hintsHtml(rows){
  const L=rows.map(r=>r.p), ms=rows.filter(r=>!r.p.ik).map(r=>balMsg(r.p,L)).filter(Boolean);
  if(!ms.length)return `<div class="hints"><span class="okm">Все в пределах баланса рабочего времени.</span> Меняйте смены — часы и баланс пересчитываются сразу.</div>`;
  const nr=ms.filter(m=>m.k==='r').length, ny=ms.length-nr;
  const red=ms.filter(m=>m.k==='r'), y=ms.filter(m=>m.k==='y');
  return `<details class="hints" id="hints"${S.hintsOpen?' open':''}><summary>${nr?`<span class="r">Выше баланса: ${nr}</span>`:'<span class="okm">Никто не выше баланса</span>'}${ny?` · недобор: ${ny}`:''} — подсказки</summary><div style="margin-top:6px">${red.length?`<h4>Выше баланса рабочего времени: ${red.length}</h4><ul>${red.map(m=>`<li class="r">${esc(m.t)}</li>`).join('')}</ul>`:'<span class="okm">Никто не выше баланса рабочего времени.</span>'}${y.length?`<details style="margin-top:6px"><summary class="y" style="cursor:pointer;color:var(--warn)">Недобор больше двух смен: ${y.length}</summary><ul style="margin-top:4px">${y.map(m=>`<li class="y">${esc(m.t)}</li>`).join('')}</ul></details>`:''}</div></details>`;
}

/* ---- staff ---- */
function staffView(){
  const c=cfg(), B=STAFF[S.br]||{};
  const tbl=grp=>{
    const all=(B[grp]||[]).map(x=>Object.assign({},x,{grp,id:pid(x.n)})).concat((c.extra[grp]||[]).map(n=>({n,r:1,o:'добавлена вручную',grp,id:pid(n),added:1})));
    return `<div class="tw"><table class="s"><thead><tr><th>Сотрудник</th><th>Ставка</th>${DOP[grp].map(([k,t])=>`<th class="ck">${t}</th>`).join('')}<th class="ck">В графике</th></tr></thead><tbody>${all.map(p=>{const off=!!c.gone[p.id];return `<tr class="${off?'off':''}"><td>${esc(p.n)}<span class="was">${esc(p.o||'')}${p.note?' · '+esc(p.note):''}</span></td><td>${String(p.r).replace('.',',')}</td>${DOP[grp].map(([k])=>`<td class="ck"><input type="checkbox" id="d-${p.id}-${k}" data-dop="${p.id}|${k}"${hasDop(p,k)?' checked':''} aria-label="${k}"></td>`).join('')}<td class="ck"><input type="checkbox" id="g-${p.id}" data-gone="${p.id}"${off?'':' checked'} aria-label="В графике"></td></tr>`}).join('')}</tbody></table></div>
    <div class="add"><input id="add-${grp}" type="text" placeholder="ФИО нового сотрудника"><button type="button" class="btn" data-add="${grp}">Добавить</button></div>`;
  };
  const ik=(B.ik||[]);
  return `${(B.head||[]).length?`<div class="card"><h3>Руководитель сестринской службы</h3><p class="sub" style="margin:0">${esc(B.head.join(', '))} — составляет наряд и график филиала.</p></div>`:''}<div class="card"><h3>Медицинские сёстры-универсалы</h3><p class="sub">Из оргструктуры ноября 2026: бывшие медсёстры КС, ДС и трансфузионного кабинета. Отметьте, к каким зонам у сестры есть допуск: в наряде на зону без допуска её можно поставить, но список подсветит это жёлтым.</p>${tbl('mc')}</div>
  ${(B.pit||[]).length?`<div class="card"><h3>Медсёстры ПИТ</h3><p class="sub">Отдельная группа со своим графиком и постами ПИТ. В наряд универсалов не входят.</p>${tbl('pit')}</div>`:''}
  <div class="card"><h3>Санитарки</h3><p class="sub">Уход и клининг объединены в одну должность. Допуск показывает, куда санитарку ставить в наряде.</p>${tbl('san')}</div>
  <div class="card"><h3>Не входят в наряд</h3><p class="sub">${ik.length?`Медсестра инфекционного контроля ${esc(ik[0].n)} — 8 часов по будням, в графике показана отдельной строкой. `:''}Медсёстры кабинета разведения в этом модуле не планируются: они в фармблоке.</p></div>`;
}

/* ---- settings ---- */
function settingsView(){
  const c=cfg(), M=mon(), norm=M.norm!=null?M.norm:normDef();
  const zl=(grp,sh)=>`<div class="zl"><h4>${GN[grp]} · ${sh==='day'?'день':'ночь'}</h4>${(zones(grp,sh)).map((z,i)=>`<div class="zr"><input type="text" id="zn-${grp}-${sh}-${i}" data-zn="${grp}|${sh}|${i}" value="${esc(z.n)}" aria-label="Название зоны"><select id="zk-${grp}-${sh}-${i}" data-zk="${grp}|${sh}|${i}" aria-label="Допуск">${DOP[grp].filter(x=>x[0]!=='st').map(([k,t])=>`<option value="${k}"${z.k===k?' selected':''}>${t}</option>`).join('')}</select><label><input type="checkbox" id="zs-${grp}-${sh}-${i}" data-zsit="${grp}|${sh}|${i}"${z.sit?' checked':''}>ситуативно</label><button type="button" class="x" data-zdel="${grp}|${sh}|${i}" aria-label="Удалить зону">✕</button></div>`).join('')}<button type="button" class="btn sm" data-zadd="${grp}|${sh}">+ зона</button></div>`;
  return `<div class="card"><h3>Смены и схема · ${esc(S.br)}</h3><div class="frow">
    <label>Схема графика<select id="s-scheme" data-cfg="scheme">${Object.entries(SCH).map(([k,v])=>`<option value="${k}"${c.scheme===k?' selected':''}>${esc(v.name)}</option>`).join('')}</select></label>
    <label>День с<input type="time" id="s-ds" data-cfg="ds" value="${c.ds}"></label><label>до<input type="time" id="s-de" data-cfg="de" value="${c.de}"></label>
    <label>Ночь с<input type="time" id="s-ns" data-cfg="ns" value="${c.ns}"></label><label>до<input type="time" id="s-ne" data-cfg="ne" value="${c.ne}"></label>
    <label>Перерыв, ч<input type="number" step="0.5" min="0" max="3" id="s-brk" data-cfg="brk" value="${c.brk}"></label>
    <label>Норма месяца, ч<input type="number" min="0" max="250" id="s-norm" data-norm="1" value="${norm}"></label></div></div>
  <div class="card"><h3>Зоны наряда</h3><p class="sub">Постоянные зоны есть в каждой смене. Ситуативные (например, пост 3) открываются в наряде на конкретный день.</p><div class="zed">${GRPS().map(g=>zl(g,'day')+zl(g,'night')).join('')}</div>
    <div style="margin-top:10px"><button type="button" class="btn terra" data-reset="1">Вернуть зоны по умолчанию</button></div></div>
  <div class="card law"><h3>Трудовой кодекс РК</h3><ul>
    <li>Смены по 12 часов — при суммированном учёте рабочего времени (ст. 75), учётный период закрепить в приказе.</li>
    <li>Перерыв при смене длиннее 8 часов — не меньше 1 часа и в рабочее время не входит. Если сестра не может уйти с поста, час считается рабочим.</li>
    <li>Отдых между сменами — не меньше 12 часов: после ночи на день не ставим. График это подсвечивает красной рамкой.</li>
    <li>Сверхурочные — не больше 12 часов в месяц и 120 в год. Ночное время 22:00–06:00 оплачивается с повышением.</li>
  </ul></div>`;
}

/* ---- render ---- */
const TABS=[['naryad','Наряд на день'],['grafik','График месяца'],['fn-mc','Функционал'],['voprosy','Вопросы'],['itogi','Итоги'],['staff','Сотрудники и допуски'],['settings','Настройки']];
function tab(){const h=location.hash.slice(1);if(h.startsWith('fn-')&&window.REV&&REV.owns(h))return h;return TABS.some(t=>t[0]===h)?h:'naryad'}
function render(){
  $('brs').innerHTML=BR.map(b=>`<button type="button" data-br="${b}" aria-pressed="${S.br===b}">${b}</button>`).join('');
  $('mon').textContent=MON_N[S.m]+' '+S.y;
  const t=tab(), rv=window.REV&&REV.owns(t);
  $('brs').hidden=!!rv; $('mnav').hidden=!!rv;
  $('tabs').innerHTML=TABS.map(([k,n])=>{const cur=k===t||(k==='fn-mc'&&t.startsWith('fn-'));return `<a href="#${k}"${cur?' aria-current="page"':''}>${n}${k==='fn-mc'&&window.REV?` <span style="font-weight:400;opacity:.8">${REV.answered()}/${REV.total()}</span>`:''}</a>`}).join('');
  const sx=($('strip')||{}).scrollLeft, gw0=document.querySelector('.gwrap'), gs=gw0?[gw0.scrollLeft,gw0.scrollTop]:null, hz=$('hints');if(hz)S.hintsOpen=hz.open;
  $('out').innerHTML=rv?REV.render(t):t==='grafik'?gridView():t==='staff'?staffView():t==='settings'?settingsView():naryadView();
  if(rv)REV.after();
  const gw=document.querySelector('.gwrap');if(gw){if(gs){gw.scrollLeft=gs[0];gw.scrollTop=gs[1]}else{const th=gw.querySelector('th.dh.sel');if(th)gw.scrollLeft=Math.max(0,th.offsetLeft-gw.clientWidth/2)}}
  const st=$('strip');if(st){if(sx!=null)st.scrollLeft=sx;const b=st.querySelector('[aria-pressed="true"]');if(b&&sx==null)b.scrollIntoView({inline:'center',block:'nearest'})}
  status();
}
function rerender(){const a=document.activeElement;if(a&&(a.tagName==='INPUT'&&a.type==='text'))return;render()}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-gday],[data-cell],button');if(!t)return;const ds=t.dataset;
  if(ds.br){S.br=ds.br;S.p3=null;try{localStorage.setItem('nar-br',S.br)}catch(_){}render();return}
  if(ds.m){S.m+=+ds.m;if(S.m<0){S.m=11;S.y--}if(S.m>11){S.m=0;S.y++}S.d=1;S.p3=null;render();return}
  if(ds.day){S.d=+ds.day;S.p3=null;render();return}
  if(ds.gday){S.d=+ds.gday;location.hash='naryad';return}
  if(ds.cell){const[id,d]=ds.cell.split('|');const L=people(S.grp),p=L.find(x=>x.id===id);if(!p)return;const cur=code(p,L,+d);let nx=CYC[(CYC.indexOf(cur)+1)%CYC.length];if(!CYC.includes(cur))nx='Д';setCode(p,+d,nx);saveMon();render();const m=balMsg(p,L);if(m&&m.k==='r')toast(m.t);return}
  if(ds.grp){S.grp=ds.grp;render();return}
  if(ds.auto){['day','night'].forEach(sh=>GRPS().forEach(g=>autoAssign(S.d,sh,g)));saveMon();render();toast('Наряд расставлен. Проверьте и поправьте вручную');return}
  if(ds.clear){const M=touch();const o=(M.nar[S.d]||{}).open;M.nar[S.d]=o?{open:o}:{};saveMon();render();return}
  if(ds.copy){const tx=copyText();navigator.clipboard&&navigator.clipboard.writeText(tx).then(()=>toast('Наряд скопирован — можно вставить в WhatsApp'),()=>toast('Не удалось скопировать'));return}
  if(ds.open){const[sh,z]=ds.open.split('|');S.p3={d:S.d,sh,z};render();return}
  if(ds.p3cancel){S.p3=null;render();return}
  if(ds.reason&&S.p3){const M=touch();M.nar[S.p3.d]=M.nar[S.p3.d]||{};M.nar[S.p3.d].open=M.nar[S.p3.d].open||{};M.nar[S.p3.d].open[S.p3.z]=ds.reason;const{d,sh,z}=S.p3;S.p3=null;GRPS().forEach(g=>{const zz=zones(g,sh).find(x=>x.id===z);if(!zz)return;const k=g+'_'+sh,a=M.nar[d][k]=M.nar[d][k]||{},used=new Set(Object.values(a));const f=onShift(g,sh,d).find(q=>!used.has(q.id)&&hasDop(q,zz.k));if(f){a[z]=f.id;toast(zz.n+': поставлена '+short(f.n)+' из резерва смены')}else toast(zz.n+' открыт, свободных в смене нет — вызовите из выходного')});saveMon();render();return}
  if(ds.close){const[sh,z]=ds.close.split('|');const M=touch();const n=M.nar[S.d]||{};if(n.open)delete n.open[z];GRPS().forEach(g=>{const a=n[g+'_'+sh];if(a)delete a[z]});saveMon();render();return}
  if(ds.call){const[sh,g,id]=ds.call.split('|');const p=people(g).find(x=>x.id===id);if(p){setCode(p,S.d,sh==='day'?'Д':'Н');saveMon();render();const m=balMsg(p,people(g));toast(m&&m.k==='r'?m.t:short(p.n)+' вызвана на смену, в графике это отмечено')}return}
  if(ds.add){const inp=$('add-'+ds.add),n=(inp.value||'').trim();if(!n)return;const c=cfg();c.extra[ds.add]=c.extra[ds.add]||[];if(!c.extra[ds.add].includes(n))c.extra[ds.add].push(n);BDEF={};saveCfg();render();return}
  if(ds.zadd){const[g,sh]=ds.zadd.split('|');const c=cfg();c.zones[g]=c.zones[g]||{day:[],night:[]};c.zones[g][sh].push({id:'z'+Date.now().toString(36),n:'Новая зона',k:g==='mc'?'post':g==='pit'?'pit':'care',sit:1});saveCfg();render();return}
  if(ds.zdel){const[g,sh,i]=ds.zdel.split('|');cfg().zones[g][sh].splice(+i,1);saveCfg();render();return}
  if(ds.reset){cfg().zones=defZones(S.br);saveCfg();render();toast('Зоны возвращены по умолчанию');return}
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.zone){const[sh,g,z]=ds.zone.split('|');const M=touch();M.nar[S.d]=M.nar[S.d]||{};const k=g+'_'+sh;const a=M.nar[S.d][k]=M.nar[S.d][k]||{};
    if(t.value){Object.keys(a).forEach(x=>{if(a[x]===t.value)delete a[x]});a[z]=t.value}else delete a[z];saveMon();render();return}
  if(ds.st){const M=touch();M.nar[S.d]=M.nar[S.d]||{};M.nar[S.d][ds.st]=t.value||null;saveMon();render();return}
  if(ds.b){const M=touch();M.p[ds.b]=Object.assign(M.p[ds.b]||{},{b:t.value});saveMon();render();return}
  if(ds.dop){const[id,k]=ds.dop.split('|');const c=cfg();c.dop[id]=c.dop[id]||{};c.dop[id][k]=t.checked;saveCfg();render();return}
  if(ds.gone){const c=cfg();if(t.checked)delete c.gone[ds.gone];else c.gone[ds.gone]=1;BDEF={};saveCfg();render();return}
  if(ds.cfg){const c=cfg(),k=ds.cfg;c[k]=k==='brk'?(+t.value||0):t.value;if(k==='scheme'){BDEF={}}saveCfg();render();return}
  if(ds.norm){const M=touch();M.norm=+t.value||0;saveMon();render();return}
  if(ds.zn||ds.zk||ds.zsit){const[g,sh,i]=(ds.zn||ds.zk||ds.zsit).split('|');const z=cfg().zones[g][sh][+i];if(ds.zn)z.n=t.value.trim()||z.n;else if(ds.zk)z.k=t.value;else z.sit=t.checked?1:0;saveCfg();render();return}
});
window.NB_render=render;
addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();

(async function(){
  const timer=setTimeout(()=>{if(dbState==='load'){dbState='off';render()}},10000);
  try{
    const d=await window.claude?.use('db');
    clearTimeout(timer);
    if(!d){dbState='off';render();return}
    db=d;dbState='on';render();
    db.collection('cfg').onSnapshot(sn=>{sn.docs.forEach(x=>{if(dirty['c_'+x.id])return;const v=x.data()||{},b=defCfg(x.id);CFG[x.id]=Object.assign(b,v,{zones:Object.assign({},b.zones,v.zones||{}),dop:v.dop||{},extra:Object.assign({mc:[],pit:[],san:[]},v.extra||{}),gone:v.gone||{}})});BDEF={};rerender()},()=>{});
    db.collection('mon').onSnapshot(sn=>{sn.docs.forEach(x=>{if(dirty[x.id])return;const v=x.data()||{};MON[x.id]={p:v.p||{},nar:v.nar||{},norm:v.norm}});rerender()},()=>{});
  }catch(_){clearTimeout(timer);dbState='off';render()}
})();
})();
</script>
