<script>
/* Адаптер к общей базе «Функционала» (Supabase, таблица items): коллекции sb_cfg, sb_mon, sb_reviews */
(function(){
  const PFX='sb_';
  let SB=null, ME=null, ready=null;
  function init(){
    if(ready)return ready;
    ready=(async()=>{
      if(!window.supabase||!window.SUPABASE_URL)return false;
      SB=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
      const {data:{session}}=await SB.auth.getSession();
      if(!session)return false;
      ME=session.user.email;
      try{const {data:ok,error}=await SB.rpc('is_allowed');if(!error&&ok===false)return false}catch(_){}
      return true;
    })();
    return ready;
  }
  const split=p=>{const i=p.indexOf('/');return [PFX+p.slice(0,i),p.slice(i+1)]};
  const mk=(id,data)=>({id,data:()=>data});
  const db={
    doc(path){const [coll,id]=split(path);return {
      async get(){const {data,error}=await SB.from('items').select('data').eq('coll',coll).eq('id',id).maybeSingle();if(error)throw error;return {exists:!!data,data:()=>data?data.data:undefined}},
      async set(doc){const {error}=await SB.from('items').upsert({coll,id,data:doc,by_email:ME,at:new Date().toISOString()});if(error)throw error}
    }},
    collection(name){const coll=PFX+name;return {
      onSnapshot(cb,err){
        let stop=false;
        async function pull(){
          if(stop)return;
          if(document.visibilityState!=='hidden'){
            try{const out=[];let from=0;for(;;){const {data,error}=await SB.from('items').select('id,data').eq('coll',coll).range(from,from+999);if(error)throw error;data.forEach(x=>out.push(mk(x.id,x.data)));if(data.length<1000)break;from+=1000}cb({docs:out})}
            catch(e){err&&err(e)}
          }
          setTimeout(pull,15000);
        }
        pull();
        return ()=>{stop=true};
      }
    }}
  };
  window.claude={use:async name=>{const ok=await init();if(!ok)return null;if(name==='db')return db;if(name==='user')return {id:async()=>ME,isOwner:async()=>false};return null}};
})();
</script>

  if(ds.auto){let miss=0;['day','night'].forEach(sh=>GRPS().forEach(g=>{miss+=autoAssign(S.d,sh,g)}));unapprove(S.d);saveMon();render();toast(miss?`Наряд сформирован, пустых зон: ${miss} — свободных по правилам нет`:'Наряд сформирован. Проверьте и утвердите');return}
  if(ds.prev){copyPrev(S.d);return}
  if(ds.ok){const M=touch();M.nar[S.d]=M.nar[S.d]||{};const t=new Date();M.nar[S.d].ok={at:t.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),by:ME_ID||''};saveMon();render();toast('Наряд утверждён');return}
  if(ds.pick){const[sh,g,id]=ds.pick.split('|');S.pick=(S.pick&&S.pick.id===id&&S.pick.sh===sh)?null:{d:S.d,sh,g,id};render();return}
  if(ds.put&&S.pick){const[sh,g,z]=ds.put.split('|');assignTo(S.d,sh,g,z,S.pick.id);return}
  if(ds.nc){const[sh,g,z]=ds.nc.split('|');notCame(S.d,sh,g,z);return}
  if(ds.clear){const M=touch();const o=(M.nar[S.d]||{}).open;M.nar[S.d]=o?{open:o}:{};S.pick=null;saveMon();render();return}
  if(ds.copy){const tx=copyText();navigator.clipboard&&navigator.clipboard.writeText(tx).then(()=>toast('Наряд скопирован — можно вставить в WhatsApp'),()=>toast('Не удалось скопировать'));return}
  if(ds.today){S.y=now.getFullYear();S.m=now.getMonth();S.d=now.getDate();render();return}
  if(ds.open){const[sh,z]=ds.open.split('|');const zz=GRPS().map(g=>zones(g,sh).find(x=>x.id===z)).find(Boolean);if(zz&&!zz.sit){openZone(S.d,sh,z,'+');return}S.p3={d:S.d,sh,z};render();return}
  if(ds.p3cancel){S.p3=null;render();return}
  if(ds.reason&&S.p3){const{d,sh,z}=S.p3;S.p3=null;openZone(d,sh,z,ds.reason);return}
  if(ds.close){const[sh,z]=ds.close.split('|');const M=touch();const n=M.nar[S.d]||{};if(n.open)delete n.open[z];GRPS().forEach(g=>{const a=n[g+'_'+sh];if(a)delete a[z];syncSt(S.d,sh,g)});unapprove(S.d);saveMon();render();return}
  if(ds.call){const[sh,g,id]=ds.call.split('|');const p=people(g).find(x=>x.id===id);if(p){setCode(p,S.d,sh==='day'?'Д':'Н');saveMon();render();const m=balMsg(p,people(g));toast(m&&m.k==='r'?m.t:short(p.n)+' вызвана на смену, в графике это отмечено')}return}
  if(ds.add){const inp=$('add-'+ds.add),n=(inp.value||'').trim();if(!n)return;const c=cfg();c.extra[ds.add]=c.extra[ds.add]||[];if(!c.extra[ds.add].includes(n))c.extra[ds.add].push(n);BDEF={};saveCfg();render();return}
  if(ds.zadd){const[g,sh]=ds.zadd.split('|');const c=cfg();c.zones[g]=c.zones[g]||{day:[],night:[]};c.zones[g][sh].push({id:'z'+Date.now().toString(36),n:'Новая зона',k:g==='mc'?'post':g==='pit'?'pit':'care',s:sh==='day'?'08:00':'18:00',h:sh==='day'?10:14,opt:1});saveCfg();render();return}
  if(ds.zdel){const[g,sh,i]=ds.zdel.split('|');cfg().zones[g][sh].splice(+i,1);saveCfg();render();return}
  if(ds.reset){cfg().zones=defZones(S.br);saveCfg();render();toast('Зоны возвращены по умолчанию');return}
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.zone){const[sh,g,z]=ds.zone.split('|');assignTo(S.d,sh,g,z,t.value);return}
  if(ds.st){const M=touch();M.nar[S.d]=M.nar[S.d]||{};M.nar[S.d][ds.st]=t.value||null;saveMon();render();return}
  if(ds.b){const M=touch();M.p[ds.b]=Object.assign(M.p[ds.b]||{},{b:t.value});saveMon();render();return}
  if(ds.dop){const[id,k]=ds.dop.split('|');const c=cfg();c.dop[id]=c.dop[id]||{};c.dop[id][k]=t.checked;saveCfg();render();return}
  if(ds.nn){const c=cfg();c.nonight=c.nonight||{};if(t.checked)c.nonight[ds.nn]=1;else delete c.nonight[ds.nn];saveCfg();render();return}
  if(ds.gone){const c=cfg();if(t.checked)delete c.gone[ds.gone];else c.gone[ds.gone]=1;BDEF={};saveCfg();render();return}
  if(ds.cfg){const c=cfg(),k=ds.cfg;c[k]=k==='brk'?(+t.value||0):t.value;if(k==='scheme'){BDEF={}}saveCfg();render();return}
  if(ds.norm){const M=touch();M.norm=+t.value||0;saveMon();render();return}
  if(ds.zn||ds.zk||ds.zsit||ds.zst||ds.zh||ds.zwd||ds.zmode){const[g,sh,i]=(ds.zn||ds.zk||ds.zsit||ds.zst||ds.zh||ds.zwd||ds.zmode).split('|');const z=cfg().zones[g][sh][+i];if(ds.zn)z.n=t.value.trim()||z.n;else if(ds.zk)z.k=t.value;else if(ds.zst)z.s=t.value||'08:00';else if(ds.zh)z.h=Math.max(1,Math.min(24,+t.value||8));else if(ds.zwd)z.wd=t.checked?1:0;else if(ds.zmode){z.sit=t.value==='sit'?1:0;z.opt=t.value==='opt'?1:0}else z.sit=t.checked?1:0;saveCfg();render();return}
});
window.NB_render=render;
addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();

(async function(){
  const timer=setTimeout(()=>{if(dbState==='load'){dbState='off';render()}},10000);
  try{
    const d=await window.claude?.use('db');
    try{const u=await window.claude?.use('user');ME_ID=u?(await u.id())||'':''}catch(_){}
    clearTimeout(timer);
    if(!d){dbState='off';render();return}
    db=d;dbState='on';render();
    db.collection('cfg').onSnapshot(sn=>{sn.docs.forEach(x=>{if(dirty['c_'+x.id])return;let v=x.data()||{};const b=defCfg(x.id);if(v.zv!==2&&v.zv!==3)v=Object.assign({},v,{zones:null,ds:b.ds,de:b.de,ns:b.ns,ne:b.ne,brk:b.brk,zv:2});if(v.zv!==3){v=Object.assign({},v,{zv:3});if(!v.scheme||v.scheme==='sep')v.scheme=b.scheme}CFG[x.id]=Object.assign(b,v,{zones:Object.assign({},b.zones,v.zones||{}),dop:v.dop||{},extra:Object.assign({mc:[],pit:[],san:[]},v.extra||{}),gone:v.gone||{}})});BDEF={};rerender()},()=>{});
    db.collection('mon').onSnapshot(sn=>{sn.docs.forEach(x=>{if(dirty[x.id])return;const v=x.data()||{};MON[x.id]={p:v.p||{},nar:v.nar||{},norm:v.norm}});rerender()},()=>{});
  }catch(_){clearTimeout(timer);dbState='off';render()}
})();
})();
