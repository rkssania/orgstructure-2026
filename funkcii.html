<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Функционал</title>
<style>
/* Навигация в стиле iPhone: подразделение → отдел → должность → функция. Сгруппированные списки, стрелки, кнопка «Назад» в шапке */
:root{--bg:#f2f2f7;--card:#ffffff;--ink:#14223d;--muted:#6b7590;--line:#d9dce5;--navy:#1b2f57;--navy-ink:#ffffff;--tint:#1d5fbf;
  --ok:#2f8a4f;--ok-soft:#e3f2e8;--no:#c4452f;--diff:#b77a00;--diff-soft:#fbf0d4;--idle:#c4c8d2;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b111d;--card:#172033;--ink:#e8edf6;--muted:#97a3bd;--line:#2c3a55;--navy:#2c4a86;--tint:#6ea8ff;
  --ok:#5fc283;--ok-soft:#163024;--no:#ef7c66;--diff:#e3b54d;--diff-soft:#3a3017;--idle:#4a5672;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b111d;--card:#172033;--ink:#e8edf6;--muted:#97a3bd;--line:#2c3a55;--navy:#2c4a86;--tint:#6ea8ff;
  --ok:#5fc283;--ok-soft:#163024;--no:#ef7c66;--diff:#e3b54d;--diff-soft:#3a3017;--idle:#4a5672;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.nav .in{max-width:720px;margin:0 auto;height:46px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.sh{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:22px 16px 6px}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:11px 14px 11px 16px;cursor:pointer;position:relative;min-height:48px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.row:active{background:color-mix(in srgb,var(--idle) 30%,transparent)}
.row .tx{flex:1;min-width:0}
.row .t{display:block}
.row .t.b{font-weight:600}
.row .s{font-size:14px;color:var(--muted);margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.row .dot{margin:0 4px}
.pill{display:inline-block;font-size:12px;border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:1px;font-weight:500}
.pill.dr{background:var(--diff-soft);color:var(--diff)} .pill.fx{background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint)}

.ppl .lbl{font-size:13px;color:var(--muted);margin-bottom:4px}
.prog{display:flex;align-items:center;gap:10px;margin:14px 2px 0;font-size:14px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--idle) 45%,transparent);overflow:hidden;display:flex}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 2px 0}

.card{background:var(--card);border-radius:12px;padding:14px 16px;margin-top:12px}
.card .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.card .txt{white-space:pre-line;overflow-wrap:anywhere;font-size:16px}
.io{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

.io b{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:6px}
.io b:first-child{margin-top:0}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ans button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 6px;font-weight:600;font-size:15px;cursor:pointer}
.ans button[aria-pressed="true"].do{background:var(--ok);border-color:var(--ok);color:#fff}
.ans button[aria-pressed="true"].no{background:var(--no);border-color:var(--no);color:#fff}
.ans button[aria-pressed="true"].diff{background:var(--diff);border-color:var(--diff);color:#fff}
.note{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.note.au{background:var(--ok-soft)} .note.au b{color:var(--ok)}
.note.fx{background:color-mix(in srgb,var(--tint) 12%,transparent)} .note.fx b{color:var(--tint)}
.ta{margin-top:12px}
.ta label{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px 4px}
.ta textarea{width:100%;min-height:96px;border:0;border-radius:12px;padding:12px 14px;background:var(--card);font-size:16px;resize:vertical}
.ta .hint{font-size:13px;color:var(--muted);margin:6px 4px 0}
.links{display:flex;flex-direction:column;margin-top:12px;background:var(--card);border-radius:12px;overflow:hidden}
.links button{background:none;border:0;text-align:left;padding:13px 16px;color:var(--tint);cursor:pointer;position:relative}
.links button+button::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pager button{flex:1;border:0;background:var(--card);border-radius:12px;padding:13px;color:var(--tint);font-weight:600;cursor:pointer}
.pager button[disabled]{opacity:.4;cursor:default}
.saved{font-size:13px;color:var(--ok);margin:8px 4px 0;min-height:1.2em}
.warn{background:var(--diff-soft);color:var(--diff);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.msg{color:var(--muted);padding:30px 0;text-align:center}
.wa{display:block;text-align:center;background:var(--ok);color:#fff;border-radius:12px;padding:13px;font-weight:600;text-decoration:none;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.wrap.anim{animation:in .18s ease-out}@keyframes in{from{opacity:.5;transform:translateX(14px)}to{opacity:1;transform:none}}}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.login form{background:var(--card);border-radius:14px;padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:10px}
.login h2{margin:0;font-size:24px}
.login input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);color:var(--ink);font:inherit}
.login .err{color:var(--no);font-size:14px;min-height:1em}
.login .lk{background:none;border:0;color:var(--tint);padding:0;cursor:pointer;font:inherit;font-size:15px}
.me-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:24px}
.me-bar button{background:none;border:0;color:var(--tint);cursor:pointer;font:inherit;font-size:13px}
</style></head><body>

<div class="login" id="login" hidden><form id="lf"><h2>Функционал</h2><p style="margin:0;color:var(--muted);font-size:15px">ТОО «Центр гематологии». Войдите с тем же email и паролем, что и в оргструктуре.</p>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dn=d=>String(d).replace(' · ',' — ');
const disp=t=>t.includes('·')?t.split('·')[1].trim():t;
const short=n=>n.replace('Медподразделение ','').replace('Филиал ','').replace('Лаборатория и ООЛЛ','Лаборатория').replace('Центральный аппарат','ЦА');
const WA='77055170015', BR=['КРГ','УК','Астана'];
const UN={'КРГ':'Караганда','УК':'Усть-Каменогорск','Астана':'Астана','ЦА':'ЦА','Лаборатория':'Лаборатория'};
const ST={do:'Делаю',no:'Не делаю',diff:'Иначе'};
const F=[['proc','Название функции'],['desc','Описание'],['inp','Получает (документы, информация)'],['frm','От кого'],['outp','Передаёт'],['to','Кому']];
const CHEV='<svg class="chev" width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const BACK='<svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let Q='', IDX=null, HL='', OWNER=false, USER=null, NAMES={}, LOC={};
const HIDE=['Генеральный директор','Исполнительный директор'];
const hidden=c=>!OWNER&&HIDE.includes(c.t);
let D=null, ALL={}, SB=null, db=null, ME=null, dbState='load', HOME=0, panel={}, depth=0;
const OWNERS=['rkssania@gmail.com'];
let EDITS={}, OTH={}, feedOn=false;
const when=t=>{try{return new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(_){return''}};
const nm=id=>(id&&id===ME)?'Вы':(id?String(id).split('@')[0]:'Коллега');
function names(ids){return;const need=[...new Set(ids.filter(x=>x&&!(x in NAMES)))];if(!need.length)return;need.forEach(x=>NAMES[x]='');
  USER.profiles(need).then(ps=>{need.forEach(x=>NAMES[x]=(ps&&ps[x]&&ps[x].name)||'');rr()}).catch(()=>{})}
// адреса: (пусто) | u-UI | d-UI-GI-DI (DI=h — руководство) | p-UI-GI-DI-PI | f-UI-GI-DI-PI-OI | a-UI-GI-DI-PI-SEC (новая функция)
function parse(){const h=location.hash.slice(1).split('-');return{k:h[0]||'',a:h.slice(1)}}
function posList(ui,gi,di){const G=D.units[ui].groups[gi];return di==='h'?G.head:G.depts[+di].pos}
function deptName(ui,gi,di){const G=D.units[ui].groups[gi];return di==='h'?'Руководство':dn(G.depts[+di].name)}
/* --- функции с учётом правок коллег --- */
const ekey=(ci,oi,u)=>`c${ci}o${oi}`+(BR.includes(u)?`u${u}`:'');
function opsOf(c,u){
  const ci=D.cards.indexOf(c), out=[];
  c.ops.forEach((o,i)=>{if(BR.includes(u)&&o.br&&!o.br.includes(u))return;const oi=String(i),e=EDITS[ekey(ci,oi,u)];if(e&&e.del)return;out.push([e?Object.assign({},o,pick(e),{ed:e}):o,oi])});
  Object.values(EDITS).filter(e=>e.isNew&&e.c===ci&&(e.u===u||!BR.includes(u)&&!BR.includes(e.u))&&!e.del).sort((a,b)=>a.t0-b.t0).forEach(e=>out.push([Object.assign({sec:e.sec||'main'},pick(e),{ed:e,added:1}),e.oi]));
  return out;
}
function pick(e){const r={};F.forEach(([k])=>{if(e[k]!=null)r[k]=e[k]});return r}
const oid=(ui,gi,ci,oi)=>`u${ui}g${gi}c${ci}o${oi}`;
function stats(ui,gi,e){const U=D.units[ui],ops=opsOf(D.cards[e.c],U.id);const r={do:0,no:0,diff:0,n:ops.length};ops.forEach(([,oi])=>{const a=ALL[oid(ui,gi,e.c,oi)];if(a&&r[a.st]!=null)r[a.st]++});r.done=r.do+r.no+r.diff;return r}
function nav(back,title){document.querySelector('.nav').hidden=!back&&!title;$('nb').innerHTML=back?`<button class="back" type="button" data-go="${back[0]}">${BACK}<span>${esc(back[1])}</span></button>`:'';$('nt').textContent=title||''}
const warn=()=>dbState==='off'?`<div class="warn">Изменения сейчас не сохраняются: нет связи с базой или доступ не выдан. Обновите страницу.</div>`:'';
function render(){
  if(!D)return;
  const {k,a}=parse(); const lv={'':0,u:1,d:2,p:3,f:4,a:4,m:5}[k]||0; const out=$('out');
  out.classList.remove('anim'); if(lv>depth){void out.offsetWidth;out.classList.add('anim')} depth=lv;
  try{
    if((k==='f'||k==='p'||k==='a')&&hidden(D.cards[posList(+a[0],+a[1],a[2])[+a[3]].c])){location.hash='';return}
    if(k==='f') return fScreen(+a[0],+a[1],a[2],+a[3],a[4]);
    if(k==='m') return mScreen(+a[0],+a[1],a[2],+a[3],a[4]||'all');
    if(k==='a') return aScreen(+a[0],+a[1],a[2],+a[3],a[4]||'main');
    if(k==='p') return pScreen(+a[0],+a[1],a[2],+a[3]);
    if(k==='d') return dScreen(+a[0],+a[1],a[2]);
    if(k==='u'&&D.units[+a[0]]) return uScreen(+a[0]);
  }catch(_){}
  home();
}
const KZ={'ә':'а','ғ':'г','қ':'к','ң':'н','ө':'о','ұ':'у','ү':'у','һ':'х','і':'и','ё':'е'};
const norm=s=>s.toLowerCase().replace(/[әғқңөұүһіё]/g,c=>KZ[c]).replace(/[^а-яa-z\s]/g,' ').trim();

}

  if(SIGNUP){if(password.length<6){$('lf-err').textContent='Пароль — не короче 6 символов';return}const {data,error}=await SB.auth.signUp({email,password});if(error){$('lf-err').textContent='Не получилось: '+error.message;return}if(!data.session){$('lf-err').textContent='Почти готово: подтвердите email по ссылке из письма, затем войдите.';return}location.reload();return}
  const {error}=await SB.auth.signInWithPassword({email,password});if(error){$('lf-err').textContent=/confirm/i.test(error.message)?'Сначала подтвердите email по ссылке из письма':'Неверный email или пароль';return}location.reload()});
$('mebar-out').addEventListener('click',async()=>{await SB.auth.signOut();location.reload()});
start();
})();
